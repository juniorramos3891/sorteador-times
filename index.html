}

// ──────────────────────────────────────────────
//  RENDER — ROOT
// ──────────────────────────────────────────────

function overlayClose(e) {
  if (e.target.classList.contains('overlay')) closeModal();
}

// The four screens reachable from the bottom .tabbar menu — see the
// ".screen-switch" CSS rule for why these specifically get a lighter
// transition when switching directly between each other. Every other
// S.modal value (addEdit, addFootball, sort, confirmDelete, confirmReset)
// is a genuine dialog and keeps the existing fadeIn/slideUp untouched.
const TAB_SCREEN_MODALS = new Set(['settings', 'ranking', 'history', 'finance']);

// Tracks S.modal across render() calls purely to detect a direct switch
// between two TAB_SCREEN_MODALS (see render()) — never used to decide
// what to render, only how the freshly-inserted .overlay is classed.
let lastModal = null;

// ──────────────────────────────────────────────
//  NAVIGATION HISTORY — Android/browser Back button
// ──────────────────────────────────────────────
//
// index.html has no URL routing (one page, no hash, no pathname segments
// — GitHub Pages only serves this one file) and, until now, never touched
// the browser's session history either: every "screen" was just S.view/
// S.modal/S.historyViewId/S.addLateRecordId/S.financeView/S.financeRecordId
// mutated in place, then render(). Native Back therefore had nothing of
// the app's own to consume and fell straight through to whatever page
// existed before this one (or closed the PWA).
//
// Fix: every FORWARD navigation (opening a screen/tab/detail/dialog —
// see each function below that calls navPush) pushes one history entry
// carrying a snapshot of those same fields. Every BACKWARD action already
// in the app (closeModal, goBack, backToHistoryList, backToFinanceDashboard,
// closeAddLatePlayers, goToDashboard, and the two "confirm" actions that
// also close their dialog) additionally calls navBack()/navFlatten(),
// which move the browser's OWN history position — so a native Back press
// and clicking the visible ✕/← run through the exact same popstate
// restoration below, never two different code paths.
//
// navDepth counts how many app-pushed entries are ahead of the boot entry
// (Dashboard, depth 0). navBaseDepth is the depth to return to in ONE jump
// when a modal/dialog closes — set only when a screen opens from a "clean"
// base (S.modal was null), so a chain of nested pushes (e.g. Histórico →
// detalhe → "Adicionar atrasado") can still be flattened by closeModal()
// in a single history.go(), exactly mirroring what closeModal() already
// does to S itself (see its own reset list) — never more, never less.
let navDepth = 0;
let navBaseDepth = 0;
let navBooted = false;

function navSnapshot() {
  return {
    tiraTimeNav: true,
    depth: navDepth,
    view: S.view,
    modal: S.modal,
    // 'list' and every tabbar modal (settings/ranking/history/finance)
    // only ever show the ROSTER'S OWN data — S.players/S.selectedPlayerIds/
    // S.history, fetched by openFootball() for this one id (see there). It
    // has to travel in the snapshot so the popstate handler below can tell
    // a stale, unloaded football apart from the one already in memory and
    // re-fetch it, instead of restoring a screen for the wrong/no roster.
    currentFootballId: S.currentFootballId,
    historyViewId: S.historyViewId,
    // historyDeleteId gates renderHistoryModal()'s "Excluir sorteio?" the
    // same way historyViewId/addLateRecordId gate its other sub-screens —
    // see the precedence order at the top of that function — so it has to
    // travel in the snapshot too, or Back wouldn't close that confirm.
    historyDeleteId: S.historyDeleteId,
    addLateRecordId: S.addLateRecordId,
    financeView: S.financeView,
    financeRecordId: S.financeRecordId
  };
}

// Called once, the first time render() actually shows the app (never
// during the Loading/Login gate) — stamps the boot entry (Dashboard) as
// "ours" via replaceState, so it adds no extra entry Back has to consume,
// while still letting a later Back onto it trigger the final List→
// Dashboard step (see navBack() below). Everything after this is pushState.
function navBoot() {
  history.replaceState(navSnapshot(), '', location.href);
}

// Call right after mutating S to enter a NEW screen/tab/detail/dialog —
// never for edits within the same screen (typing, toggling a star,
// marking presence, flipping a payment status). isNewChain marks a
// transition that started from a "clean" base (S.modal was null before
// this call) — everything pushed afterward while still nested under the
// same modal shares that same floor, see navBaseDepth above.
function navPush(isNewChain) {
  if (isNewChain) navBaseDepth = navDepth;
  navDepth++;
  history.pushState(navSnapshot(), '', location.href);
}

// Relabels the CURRENT entry in place — depth/navBaseDepth untouched.
// Used only where a screen transition should NOT add (or remove) a step
// for Back to walk through, because the screen it replaces is never
// meaningfully "returned to" on its own (the Sortear Times dialog, once
// submitted, becomes Times Sorteados at that same depth — see doSort()).
// Deliberately never combined with navBack()/navFlatten() for the same
// transition: history.back()/go() are asynchronous (the actual position
// change and popstate happen on a later task), so calling pushState/
// replaceState immediately after one, in the same turn, races it — this
// keeps every transition to exactly one History API call.
function navReplace() {
  history.replaceState(navSnapshot(), '', location.href);
}

// Single-level "one step up" — backToHistoryList, backToFinanceDashboard,
// closeAddLatePlayers, goBack (Result→List), goToDashboard (List→
// Dashboard), and the two "confirm" actions that close a one-level dialog
// as a side effect (confirmRemovePlayer, confirmResetSelection,
// deleteHistoryRecord). No-ops if there is nothing of ours left to pop.
function navBack() {
  if (navDepth > 0) history.back();
}

// "Close everything nested" in ONE jump — used by closeModal() (which
// already resets S.modal/historyViewId/addLateRecordId/financeRecordId/
// financeView unconditionally, regardless of how deep they were) and by
// deleteFootballConfirmed()'s hard reset to the Dashboard on success
// (target 0). Defaults to navBaseDepth, the floor of the current chain.
function navFlatten(targetDepth) {
  const target = targetDepth === undefined ? navBaseDepth : targetDepth;
  const delta = navDepth - target;
  if (delta > 0) history.go(-delta);
}

// The single restoration point for EVERY history move — native Back,
// a native forward, or one of our own history.back()/go() calls above:
// whichever entry the browser lands on, its own stored snapshot is
// authoritative, so navDepth is resynced from it rather than tracked
// independently (robust to swipes/multi-back gestures we never see
// directly). When event.state is null or foreign (the entry that existed
// before the app ever pushed anything — e.g. the real referring page),
// there is nothing of ours to restore: the browser's own navigation
// proceeds untouched, which is exactly how leaving the app is meant to
// keep working (see item 8 of the spec this implements).
window.addEventListener('popstate', async e => {
  if (!e.state || !e.state.tiraTimeNav) return;
  const st = e.state;

  // Reload case: the page was refreshed since this entry was pushed —
  // S.currentFootballId resets to null and nothing is fetched until a
  // real openFootball() call (see onFirebaseAuthChange()) — so landing
  // back on a 'list'/tabbar-modal entry for a DIFFERENT (or no-longer-
  // in-memory) football has to redo the same fetch openFootball() does,
  // or the restored screen would show the wrong/empty roster. Same-
  // football moves (the common case) skip this entirely — no flicker.
  if (st.currentFootballId !== S.currentFootballId) {
    if (st.currentFootballId) {
      const football = S.footballs.find(f => f.id === st.currentFootballId);
      // Football is gone (deleted meanwhile) or S.footballs itself hasn't
      // loaded yet (Back pressed a beat before onFirebaseAuthChange()
      // resolves) — nothing safe to restore; leave the browser on this
      // entry, S stays exactly as it already renders.
      if (!football) return;
      S.currentFootballId = st.currentFootballId;
      S.dataLoading = true;
      render();
      await loadPlayers();
      await loadHistory();
      S.dataLoading = false;
    } else {
      S.currentFootballId = null;
    }
  }

  navDepth = st.depth;
  S.view = st.view;
  // S.result (the drawn teams) is produced client-side by doSort() and
  // never persisted — a reload wipes it. renderResult() destructures it
  // unguarded, so restoring a stale 'result' entry after a reload would
  // throw instead of rendering; land one screen short (the roster) rather
  // than crash — the same football's players/history are already being
  // restored above.
  if (S.view === 'result' && !S.result) S.view = 'list';
  S.modal = st.modal;
  S.historyViewId = st.historyViewId;
  S.historyDeleteId = st.historyDeleteId;
  S.addLateRecordId = st.addLateRecordId;
  S.financeView = st.financeView;
  S.financeRecordId = st.financeRecordId;
  render();
});

function render() {
  const app = document.getElementById('app');

  // Auth gate — decides Loading vs. Login vs. the app itself, BEFORE any
  // of the existing S.view/S.modal switch below ever runs. Dashboard/List/
  // Result/modals are completely untouched by this: they simply never get
  // reached until S.authUser is a confirmed user, so nothing downstream
  // needs to know this gate exists.
  if (typeof S.authUser === 'undefined') {
    app.innerHTML = renderAuthLoading();
    document.body.classList.remove('has-tabbar');
    return;
  }
  if (S.authUser === null) {
    app.innerHTML = renderLoginScreen();
    document.body.classList.remove('has-tabbar');
    return;
  }
  // Same idea, one step later: a confirmed user, but their footballs/
  // players/history are still being fetched from Firestore (see
  // onFirebaseAuthChange()/openFootball()) — show the identical loading
  // spinner rather than a Dashboard/List that would otherwise briefly
  // render empty or with the previous football's data.
  if (S.dataLoading) {
    app.innerHTML = renderAuthLoading();
    document.body.classList.remove('has-tabbar');
    return;
  }

  let html;
  if      (S.view === 'dashboard') html = renderDashboard();
  else if (S.view === 'result')    html = renderResult();
  else                              html = renderList();

  if      (S.modal === 'addEdit')     html += renderAddEdit();
  else if (S.modal === 'sort')        html += renderSortModal();
  else if (S.modal === 'history')     html += renderHistoryModal();
  else if (S.modal === 'addFootball') html += renderAddFootballModal();
  else if (S.modal === 'settings')    html += renderSettingsModal();
  else if (S.modal === 'ranking')      html += renderRankingModal();
  else if (S.modal === 'finance')     html += renderFinanceModal();
  else if (S.modal === 'confirmDelete') html += renderConfirmDelete();
  else if (S.modal === 'confirmReset') html += renderConfirmReset();
  else if (S.modal === 'deleteFootballConfirm') html += renderDeleteFootballConfirm();

  app.innerHTML = html;

  // Centralizes the "menu visible outside the Dashboard" rule: 'list' is
  // the only S.view that renders .tabbar (see renderList()) — this class
  // just tells .overlay (see its rule above) to leave room for it instead
  // of covering it. 'dashboard' and 'result' never render .tabbar, so the
  // class has no visible effect there and their modals cover the full
  // viewport exactly as before.
  document.body.classList.toggle('has-tabbar', S.view === 'list');

  // Marks a direct switch between two menu screens (see .screen-switch's
  // CSS for why) — the fresh .overlay just created above gets the class
  // only when the modal BEFORE this render and the modal AFTER it are both
  // one of TAB_SCREEN_MODALS and actually different. Opening one of them
  // from no modal, closing one, or any true dialog (addEdit, addFootball,
  // sort, confirmDelete, confirmReset, deleteFootballConfirm) never gets
  // it, so those keep their normal fadeIn/slideUp exactly as before.
  if (TAB_SCREEN_MODALS.has(S.modal) && TAB_SCREEN_MODALS.has(lastModal) && S.modal !== lastModal) {
    const overlay = app.querySelector('.overlay');
    if (overlay) overlay.classList.add('screen-switch');
  }
  lastModal = S.modal;

  // Auto-focus name input when modal opens
  if (S.modal === 'addEdit' || S.modal === 'addFootball' || S.modal === 'settings') {
    const inp = document.querySelector('.finput[type="text"]');
    if (inp) { inp.focus(); inp.select(); }
  }

  // Seeds the Android/browser Back button integration (see navBoot()) the
  // first time the app actually shows real content — never during the
  // Loading/Login gate above, which returns before reaching this point.
  if (!navBooted) { navBooted = true; navBoot(); }
}

// ──────────────────────────────────────────────
//  FIREBASE AUTH (UI bridge)
// ──────────────────────────────────────────────
// The actual Firebase SDK calls live in the <script type="module"> block
// at the end of the file (kept separate so the module scope doesn't break
// the onclick="..."/onchange="..." handlers above, which need these as
// plain globals). This section just reacts to auth state and renders it —
// it never touches S.players/S.history/S.footballs or localStorage.

// Called by the module script's onAuthStateChanged listener every time
// sign-in state changes (including once on page load with the previous
// session's user, if any). Etapa 4: this is also where footballs get
// loaded from Firestore — there is no earlier point with a real uid to
// read with (see the BOOT section at the bottom of the file, which no
// longer calls loadFootballs() itself).
async function onFirebaseAuthChange(user) {
  S.authUser = user;

  if (!user) {
    // Signed out (or never signed in) — never invent data and never fall
    // back to localStorage; just clear whatever was in memory so nothing
    // from a previous session/account lingers once render() reaches the
    // login screen below.
    S.footballs = [];
    S.players = [];
    S.selectedPlayerIds = new Set();
    S.history = [];
    S.currentFootballId = null;
    S.view = 'dashboard';
    S.dataLoading = false;
    render();
    return;
  }

  S.dataLoading = true;
  render();
  await loadFootballs();
  S.dataLoading = false;
  render();
}

function handleGoogleSignIn() {
  if (!window.firebaseAuth) return;
  window.firebaseAuth.signInWithGoogle().catch(err => {
    // AbortError-equivalent for popups: user just closed it — not an error.
    if (err && err.code === 'auth/popup-closed-by-user') return;
    console.error('Falha ao entrar com Google:', err);
    alert('Não foi possível entrar com o Google. Tente novamente.');
  });
}

function handleGoogleSignOut() {
  if (!window.firebaseAuth) return;
  window.firebaseAuth.signOutOfGoogle().catch(err => console.error('Falha ao sair:', err));
}

// Small widget shown at the top of the Dashboard: "Entrar com Google" when
// signed out, or the user's photo/name + "Sair" when signed in. Purely
// additive — doesn't gate or change any existing feature.
function renderAuthBar() {
  const user = S.authUser;
  if (!user) {
    return `
    <div class="auth-bar">
      <button class="auth-google-btn" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.5 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Entrar com Google
      </button>
    </div>`;
  }
  return `
  <div class="auth-bar auth-bar-signed-in">
    <div class="auth-user">
      ${user.photoURL ? `<img class="auth-avatar" src="${esc(user.photoURL)}" alt="">` : `<div class="auth-avatar auth-avatar-fallback">${esc((user.displayName || user.email || '?').charAt(0).toUpperCase())}</div>`}
      <div class="auth-user-name">${esc(user.displayName || user.email || 'Conta Google')}</div>
    </div>
    <button class="auth-signout-btn" onclick="handleGoogleSignOut()">Sair</button>
  </div>`;
}

// Dedicated entry screen, shown by render() instead of the Dashboard while
// S.authUser === null (confirmed signed out). Same visual identity as the
// Dashboard's own banner (same .dash-banner/logo), with renderAuthBar() as
// the single primary action — reused as-is, not duplicated: it already
// renders the "Entrar com Google" button whenever S.authUser is falsy,
// which is exactly the case every time this screen is the one showing.
function renderLoginScreen() {
  return `
  <div class="auth-screen">
    <div class="dash-banner">
      <img src="Images/Logo.png" alt="Tira Time" loading="eager">
    </div>
    <p class="auth-screen-tagline">Entre para organizar suas peladas</p>
    ${renderAuthBar()}
  </div>`;
}

// Shown by render() only while S.authUser is still `undefined` — the brief
// window before Firebase resolves whether a session already exists. Same
// banner as the Login screen, no buttons (nothing is actionable yet), just
// a discreet spinner so the screen never looks frozen or blank.
function renderAuthLoading() {
  return `
  <div class="auth-screen">
    <div class="dash-banner">
      <img src="Images/Logo.png" alt="Tira Time" loading="eager">
    </div>
    <div class="auth-loading-spinner" role="status" aria-label="Carregando"></div>
  </div>`;
}

// ──────────────────────────────────────────────
//  BOOT
// ──────────────────────────────────────────────

// Etapa 4: loadFootballs() is no longer called here — it's async and
// needs a signed-in uid, neither of which exist yet at this point (Firebase
// hasn't resolved auth state; S.authUser is still `undefined`). This first
// render() just shows the loading spinner (see the auth gate at the top of
// render()); onFirebaseAuthChange() — called once Firebase confirms the
// session, from the module script at the bottom of the page — is what
// actually calls loadFootballs() once a real uid is available.
render();

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(console.warn)
  );
}

// ──────────────────────────────────────────────
//  PWA INSTALL (Home)
//  Uses ONLY the browser's native beforeinstallprompt mechanism — never
//  simulates or fakes an install affordance. On browsers/platforms that
//  never fire beforeinstallprompt (e.g. iOS Safari), S.pwaInstallEvent
//  simply stays null and renderInstallCard() never renders anything; the
//  app keeps working exactly as before there.
// ──────────────────────────────────────────────

function isStandaloneDisplay() {
  return window.matchMedia('(display-mode: standalone)').matches;
}

// Chrome/Edge fire this instead of showing their own automatic install
// banner; preventDefault() suppresses that banner so the Home's own
// "Instalar Tira Time" card (see renderInstallCard()) can trigger the same
// native prompt later, on the user's own tap.
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  S.pwaInstallEvent = e;
  render();
});

// Fires once the user actually completes installation — from our own
// prompt() call below or from the browser's own menu — so the card stays
// hidden for the rest of the session either way.
window.addEventListener('appinstalled', () => {
  S.pwaInstallEvent = null;
  S.pwaInstalled = true;
  render();
});

async function installApp() {
  const promptEvent = S.pwaInstallEvent;
  if (!promptEvent) return;
  try {
    promptEvent.prompt();
    // A beforeinstallprompt event can only be used once — clear it (and
    // hide the card) right after prompt() fires, regardless of the
    // eventual accept/dismiss outcome below.
    S.pwaInstallEvent = null;
    render();
    const choice = await promptEvent.userChoice;
    console.log('PWA install prompt outcome:', choice.outcome);
  } catch (err) {
    console.warn(err);
  }
}
</script>

<!--
  FIREBASE — preparação apenas (Etapa 1)
  ──────────────────────────────────────────────
  Este bloco é um script SEPARADO, com type="module" (exigido pelos imports
  ESM do Firebase SDK v10 via CDN). Ele fica isolado do <script> principal
  acima de propósito: aquele é um script clássico (global, síncrono) do
  qual os ~100 onclick="..."/onchange="..." inline no HTML gerado por
  render() dependem — funções declaradas dentro de um <script type="module">
  NÃO viram globais automaticamente, então misturar os dois quebraria todos
  esses handlers. Como módulo é implicitamente "defer", ele só executa
  DEPOIS que o parsing do documento (e o boot síncrono acima: loadFootballs/
  render) já terminou — a ordem de boot existente não muda.

  Inicializa o Firebase App e o Firebase Authentication, expõe login/logout
  com Google em window.firebaseAuth, e notifica o script clássico acima via
  window.onFirebaseAuthChange() sempre que o estado de login mudar — é isso
  que alimenta o botão/avatar renderizado por renderAuthBar() no Dashboard.
  Nada aqui lê, grava ou apaga localStorage, nem altera players/seleção/
  histórico/peladas.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, collection, setDoc, deleteDoc, getDocs, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // Config do app Web "Tira Time" (Firebase Console > Configurações do
  // projeto > Seus apps > Config).
  const firebaseConfig = {
    apiKey: "AIzaSyBTEC8MYAFKSctyBANidi0Ncp5JRKA97Oo",
    authDomain: "tira-time-690bf.firebaseapp.com",
    projectId: "tira-time-690bf",
    storageBucket: "tira-time-690bf.firebasestorage.app",
    messagingSenderId: "323094069035",
    appId: "1:323094069035:web:201fef88ca134e5b4b0f6e"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const googleProvider = new GoogleAuthProvider();

  // getFirestore() apenas cria o handle do SDK sobre a MESMA firebaseApp já
  // inicializada acima (nenhum segundo initializeApp()); exposto em
  // window.firestoreDb. Desde a Etapa 4, este é o handle usado tanto para
  // as leituras (players/selectedPlayerIds/footballs/history — ver
  // read*() abaixo, chamadas pelos load*() do script clássico) quanto
  // para o dual-write (write*()) já existente.
  const db = getFirestore(firebaseApp);
  window.firestoreDb = db;

  // ── FIRESTORE — camada isolada de referências (Etapa 2) ──
  // Apenas monta objetos DocumentReference/CollectionReference via doc()/
  // collection() do SDK — essas chamadas são 100% locais/síncronas, não
  // fazem nenhuma requisição de rede nem tocam o Firestore de verdade.
  // Nada aqui é lido, escrito ou chamado automaticamente; existe só para
  // a sincronização futura reaproveitar os mesmos caminhos, em vez de
  // cada função de sync remontar a string do caminho na mão.
  //
  // Espelha 1:1 a estrutura proposta na análise da Etapa anterior:
  //   users/{uid}
  //   users/{uid}/footballs/{footballId}
  //   users/{uid}/footballs/{footballId}/players/{playerId}
  //   users/{uid}/footballs/{footballId}/history/{historyId}
  //   users/{uid}/footballs/{footballId}/meta/selection

  function getUserRef(uid) {
    return doc(db, 'users', uid);
  }

  // Collection ref (plural) — added in Etapa 4 alongside the read*()
  // functions below, which need to list ALL of a user's footballs.
  // getUserFootballRef (singular, doc ref) below is unchanged.
  function getUserFootballsRef(uid) {
    return collection(db, 'users', uid, 'footballs');
  }

  function getUserFootballRef(uid, footballId) {
    return doc(db, 'users', uid, 'footballs', footballId);
  }

  function getUserPlayersRef(uid, footballId) {
    return collection(db, 'users', uid, 'footballs', footballId, 'players');
  }

  function getUserPlayerRef(uid, footballId, playerId) {
    return doc(db, 'users', uid, 'footballs', footballId, 'players', playerId);
  }

  function getUserHistoryRef(uid, footballId) {
    return collection(db, 'users', uid, 'footballs', footballId, 'history');
  }

  function getUserHistoryRecordRef(uid, footballId, historyId) {
    return doc(db, 'users', uid, 'footballs', footballId, 'history', historyId);
  }

  function getUserSelectionRef(uid, footballId) {
    return doc(db, 'users', uid, 'footballs', footballId, 'meta', 'selection');
  }

  // ── FIRESTORE — leitura / fonte de verdade (Etapa 4) ──
  // Called by the classic script's load*() functions (loadFootballs/
  // loadPlayers/loadHistory) — Firestore is now the ONLY place those read
  // from; localStorage is never consulted by them anymore. Each function
  // below does exactly one getDocs()/getDoc() and returns plain data (no
  // caching, no merging with anything local) — the caller decides what to
  // do on failure (see load*() in the classic script, which never falls
  // back to localStorage: an error here means an empty result, not stale
  // local data).
  async function readFootballs(uid) {
    const snap = await getDocs(getUserFootballsRef(uid));
    return snap.docs.map(d => d.data());
  }

  async function readPlayers(uid, footballId) {
    const snap = await getDocs(getUserPlayersRef(uid, footballId));
    return snap.docs.map(d => d.data());
  }

  // Returns just the array of ids — [] both when the doc has never been
  // written (nobody marked presence yet) and when it exists but is empty;
  // the caller can't tell those apart from the array alone, same as the
  // old localStorage-missing-key case.
  async function readSelection(uid, footballId) {
    const snap = await getDoc(getUserSelectionRef(uid, footballId));
    return snap.exists() ? (snap.data().ids || []) : [];
  }

  async function readHistory(uid, footballId) {
    const snap = await getDocs(getUserHistoryRef(uid, footballId));
    return snap.docs.map(d => d.data());
  }

  // ── FIRESTORE — escrita ──
  // Called by the classic script's persist*()/save*() functions right
  // after each local state change (the old localStorage dual-write was
  // removed in Etapa 5 — Firestore is the only persistence target now,
  // same as reads since Etapa 4, see read*() above). Every rejection here
  // (offline, signed out, security rules) is swallowed right here so a
  // Firestore write failure can never affect the app's normal behavior.
  function writeFootballs(uid, footballs) {
    footballs.forEach(f => {
      setDoc(getUserFootballRef(uid, f.id), { ...f }).catch(() => {});
    });
  }

  function writePlayers(uid, footballId, players) {
    players.forEach(p => {
      setDoc(getUserPlayerRef(uid, footballId, p.id), { ...p }).catch(() => {});
    });
  }

  function deletePlayer(uid, footballId, playerId) {
    deleteDoc(getUserPlayerRef(uid, footballId, playerId)).catch(() => {});
  }

  function writeSelection(uid, footballId, selectedIds) {
    setDoc(getUserSelectionRef(uid, footballId), { ids: selectedIds }).catch(() => {});
  }

  function writeHistory(uid, footballId, records) {
    records.forEach(r => {
      setDoc(getUserHistoryRecordRef(uid, footballId, r.id), { ...r }).catch(() => {});
    });
  }

  function deleteHistoryRecord(uid, footballId, historyId) {
    deleteDoc(getUserHistoryRecordRef(uid, footballId, historyId)).catch(() => {});
  }

  // ── FIRESTORE — exclusão completa de um grupo (Configurações > Zona de
  // perigo) ──
  // Firestore NÃO apaga subcoleções sozinho ao apagar o doc pai
  // (users/{uid}/footballs/{footballId}) — cada doc de players/history
  // precisa ser apagado explicitamente, além do doc único meta/selection,
  // e o doc do futebol só pode ser apagado por ÚLTIMO (senão o app corre o
  // risco de mostrar um grupo "fantasma" sem dados, ou pior: liberar o
  // nome/id para reuso enquanto ainda há players/history órfãos).
  //
  // Um WriteBatch tem limite de 500 operações, então os refs a apagar são
  // divididos em lotes de até BATCH_LIMIT; os lotes rodam em SEQUÊNCIA
  // (await um a um, nunca em paralelo/Promise.all) e o doc do futebol,
  // sendo o último elemento do array, cai sempre no ÚLTIMO lote. Se
  // qualquer lote anterior falhar, a função rejeita imediatamente e nem
  // chega a tentar os lotes seguintes — o futebol nunca é apagado sem seus
  // dados terem sido apagados primeiro.
  //
  // Isso NÃO elimina o risco simétrico: se o grupo tiver documentos
  // suficientes para precisar de mais de um lote, um lote intermediário
  // pode falhar DEPOIS que um lote anterior de players/history já foi
  // commitado com sucesso — nesse caso alguns jogadores/sorteios já foram
  // apagados permanentemente, mas o futebol em si continua existindo (a
  // exclusão não é revertida). É a estratégia mais segura possível com o
  // Client SDK: não há transação nem Cloud Function cobrindo mais de 500
  // writes atomicamente daqui. Com o volume típico do app (dezenas de
  // jogadores/sorteios por futebol) isso roda, na prática, em um único
  // lote atômico.
  const DELETE_BATCH_LIMIT = 500;

  async function deleteFootball(uid, footballId) {
    const [playersSnap, historySnap] = await Promise.all([
      getDocs(getUserPlayersRef(uid, footballId)),
      getDocs(getUserHistoryRef(uid, footballId))
    ]);

    const refs = [
      ...playersSnap.docs.map(d => d.ref),
      ...historySnap.docs.map(d => d.ref),
      getUserSelectionRef(uid, footballId),
      getUserFootballRef(uid, footballId) // sempre por último — ver comentário acima
    ];

    for (let i = 0; i < refs.length; i += DELETE_BATCH_LIMIT) {
      const batch = writeBatch(db);
      refs.slice(i, i + DELETE_BATCH_LIMIT).forEach(ref => batch.delete(ref));
      await batch.commit();
    }
  }

  // Exposto para o script clássico: read*() é chamado pelos load*() (fonte
  // de verdade, Etapa 4); write*()/deletePlayer()/deleteHistoryRecord()
  // são chamados pelos sync*ToFirestore() logo após cada persist*()/
  // save*() local — ver a seção PERSISTENCE do script clássico.
  // deleteFootball() foge desse padrão: é chamado uma única vez, direto de
  // deleteFootballConfirmed() (Configurações > Zona de perigo), não de um
  // sync*ToFirestore() — ver essa função no script clássico.
  window.firestoreSync = {
    getUserRef,
    getUserFootballsRef,
    getUserFootballRef,
    getUserPlayersRef,
    getUserPlayerRef,
    getUserHistoryRef,
    getUserHistoryRecordRef,
    getUserSelectionRef,
    readFootballs,
    readPlayers,
    readSelection,
    readHistory,
    writeFootballs,
    writePlayers,
    deletePlayer,
    writeSelection,
    writeHistory,
    deleteHistoryRecord,
    deleteFootball
  };

  function signInWithGoogle() {
    return signInWithPopup(auth, googleProvider);
  }

  function signOutOfGoogle() {
    return signOut(auth);
  }

  // Exposed on window so the classic (non-module) app script above — and
  // future code — can reach Firebase Auth without needing its own imports.
  window.firebaseAuth = {
    app: firebaseApp,
    auth,
    currentUser: null,
    signInWithGoogle,
    signOutOfGoogle
  };

  // Fires immediately with the current user (or null) and again on every
  // sign-in/sign-out. Bridges into the classic script's onFirebaseAuthChange()
  // (defined above, in the FIREBASE AUTH (UI bridge) section), which updates
  // S.authUser and re-renders the login button/avatar in the Dashboard.
  onAuthStateChanged(auth, (user) => {
    window.firebaseAuth.currentUser = user;
    if (typeof window.onFirebaseAuthChange === 'function') {
      window.onFirebaseAuthChange(user);
    }
  });
</script>
</body>
