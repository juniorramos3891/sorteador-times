<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tira Time</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="Images/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="Images/favicon-32.png">
  <meta name="theme-color" content="#075e36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tira Time">
  <link rel="apple-touch-icon" href="Images/favicon-180.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #16a34a;
      --green-d:      #12813d;
      --green-deep:   #075e36;
      --green-l:      #dcfce7;
      --bg:           #f5f7f6;
      --surface:      #ffffff;
      --text:         #17211b;
      --muted:        #66736b;
      --border:       #dde5df;
      --danger:       #ef4444;
      --warn:         #f59e0b;
      --radius:       12px;
      --radius-s:     8px;
      --sh:           0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
      --sh-lg:        0 10px 15px -3px rgba(0,0,0,.10);
      --tabbar-h:     58px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      min-height: 100%;
    }

    /* ── HEADER ── */
    .header {
      background: var(--green-deep);
      color: #fff;
      padding: 14px 18px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--sh);
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; }
    .header h1  { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .header-sub { font-size: .75rem; opacity: .85; margin-top: 1px; }
    .header-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 3px;
    }
    .badge {
      background: rgba(255,255,255,.22);
      color: #fff;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn-reset {
      background: rgba(255,255,255,.16);
      color: #fff;
      border: 1px solid rgba(255,255,255,.4);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-reset:hover:not(:disabled) { background: rgba(255,255,255,.3); }
    .btn-reset:disabled { opacity: .45; cursor: not-allowed; }

    /* ── HEADER — Sorteio (premium) ──
       Scoped to .header-draw only, so the shared .header/.badge/.btn-reset/
       .back-btn rules above (still used by the "Times Sorteados" screen)
       stay untouched. */
    .header-draw {
      background:
        radial-gradient(130% 160% at 12% -20%, rgba(255,255,255,.09), transparent 55%),
        linear-gradient(165deg, #0b4229 0%, #07351f 55%, #052a1a 100%);
      border-bottom: 1px solid rgba(255,255,255,.08);
      border-radius: 0 0 20px 20px;
      box-shadow: 0 10px 24px -14px rgba(0,0,0,.5);
      padding: 16px 16px 14px;
    }
    .header-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-draw .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; flex: none;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      font-size: 1.05rem;
      transition: background .18s ease, transform .12s ease;
    }
    .header-draw .back-btn:hover { background: rgba(255,255,255,.18); }
    .header-draw .back-btn:active { transform: scale(.94); background: rgba(255,255,255,.22); }
    .club-chip {
      width: 36px; height: 36px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: rgba(220,252,231,.16);
      border: 1px solid rgba(220,252,231,.22);
      border-radius: 11px;
      font-size: 1.05rem;
      line-height: 1;
    }
    .header-id-text { min-width: 0; }
    .header-draw .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.25;
    }
    .header-draw .header-sub {
      font-size: .72rem;
      opacity: .7;
      margin-top: 1px;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .header-draw .badge {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80; flex: none;
      box-shadow: 0 0 0 2px rgba(74,222,128,.25);
    }
    .header-draw .header-actions { margin-top: 10px; gap: 10px; }
    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .72rem;
      opacity: .65;
      color: #fff;
      font-weight: 500;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-line svg { flex: none; opacity: .9; }
    .header-draw .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.85);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: background .18s ease, border-color .18s ease, transform .12s ease;
    }
    .header-draw .btn-reset:hover:not(:disabled) {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.32);
    }
    .header-draw .btn-reset:active:not(:disabled) { transform: scale(.97); }

    @media (max-width: 360px) {
      .header-draw { padding: 14px 12px 12px; border-radius: 0 0 16px 16px; }
      .header-draw .header-title { font-size: 1.02rem; }
      .header-draw .badge { font-size: .7rem; padding: 3px 8px; }
      .header-draw .btn-reset { padding: 3px 8px; }
    }

    /* ── HEADER — Resultado do sorteio (premium) ──
       Same treatment as .header-draw above, reusing the generic
       .header-id/.club-chip/.header-id-text classes it already defined.
       Scoped to .header-result only, so the shared .header/.badge/
       .btn-reset/.back-btn rules (still used by the roster/other screens)
       stay untouched. */
    .header-result {
      background:
        radial-gradient(130% 160% at 12% -20%, rgba(255,255,255,.09), transparent 55%),
        linear-gradient(165deg, #0b4229 0%, #07351f 55%, #052a1a 100%);
      border-bottom: 1px solid rgba(255,255,255,.08);
      border-radius: 0 0 20px 20px;
      box-shadow: 0 10px 24px -14px rgba(0,0,0,.5);
      padding: 16px 16px 14px;
    }
    .header-result .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; flex: none;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      font-size: 1.05rem;
      transition: background .18s ease, transform .12s ease;
    }
    .header-result .back-btn:hover  { background: rgba(255,255,255,.18); }
    .header-result .back-btn:active { transform: scale(.94); background: rgba(255,255,255,.22); }
    .header-result .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.25;
    }
    .header-result .header-sub {
      font-size: .72rem;
      opacity: .7;
      margin-top: 1px;
      font-weight: 500;
      letter-spacing: .01em;
    }
    .header-result .badge {
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      flex: none;
    }
    .header-result .header-actions { margin-top: 10px; }
    .header-result .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,.22);
      color: rgba(255,255,255,.85);
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      transition: background .18s ease, border-color .18s ease, transform .12s ease;
    }
    .header-result .btn-reset:hover:not(:disabled) {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.32);
    }
    .header-result .btn-reset:active:not(:disabled) { transform: scale(.97); }
    .header-result .btn-reset:disabled {
      opacity: .7;
      color: rgba(255,255,255,.7);
      border-color: rgba(255,255,255,.16);
    }

    @media (max-width: 360px) {
      .header-result { padding: 14px 12px 12px; border-radius: 0 0 16px 16px; }
      .header-result .header-title { font-size: 1.02rem; }
      .header-result .badge { font-size: .7rem; padding: 3px 8px; }
      .header-result .btn-reset { padding: 3px 8px; }
    }

    /* ── DASHBOARD BANNER (Tira Time) ──
       Own art already includes the brand's dark-green background, so no
       CSS background is layered behind it — the wrapper only clips its
       corners to match the rest of the interface's rounded surfaces.
       width:100%/height:auto keeps the image's native ratio at any
       viewport size — never stretched, never cropped. */
    .dash-banner {
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--sh);
      margin-bottom: 14px;
      line-height: 0;
    }
    .dash-banner img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* ── DASHBOARD FOOTBALL CARDS ──
       Own class, deliberately not sharing .team-card (that class is also
       used by the sort result / Ranking / Financeiro / Histórico screens —
       styling it here would bleed into all of those). Same onclick,
       same data, same conditional lines as before — purely a visual
       reshuffle of the existing markup. */
    .dash-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: 13px;
      padding: 16px 18px;
      margin-top: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      cursor: pointer;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .dash-card:hover {
      border-color: var(--green);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      transform: translateY(-1px);
    }
    .dash-card-top { display: flex; align-items: center; gap: 12px; }
    .dash-card-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 11px;
      background: var(--green-l);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
    }
    .dash-card-name {
      flex: 1; min-width: 0;
      color: var(--text);
      font-weight: 700;
      font-size: 1.06rem;
      letter-spacing: -.005em;
    }
    .dash-card-meta, .dash-card-location {
      margin-left: 52px; /* icon width (40) + gap (12) — aligns under the name */
      color: var(--muted);
      font-size: .85rem;
      font-weight: 500;
    }
    .dash-card-meta {
      display: flex; flex-wrap: wrap;
      gap: 4px 16px;
      margin-top: 10px;
    }
    .dash-card-location { margin-top: 4px; }

    /* ── DASHBOARD "ADICIONAR PELADA" BUTTON ──
       Own class, deliberately not sharing .btn-primary (that class is
       reused by every other primary/submit button in the app — Salvar
       futebol, Salvar jogador, Sortear, Salvar estatísticas, etc.).
       Same position/width/onclick as before, just its own visual recipe. */
    .dash-add-btn {
      width: 100%;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
      transition: background .2s ease, box-shadow .2s ease;
    }
    .dash-add-btn:hover  { background: var(--green-d); }
    .dash-add-btn:active { background: var(--green-d); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

    /* ── INSTALL PWA CARD (Home) ──
       Rendered only while S.pwaInstallEvent holds a real `beforeinstallprompt`
       event (see renderInstallCard()/BOOT section) — never a fake/simulated
       install affordance. Own class, doesn't touch .dash-card/.dash-add-btn. */
    .install-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .install-card:hover {
      border-color: var(--green);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }
    .install-card-icon {
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 10px;
      background: var(--green-l);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem;
    }
    .install-card-text { flex: 1; min-width: 0; }
    .install-card-title {
      color: var(--text);
      font-weight: 700;
      font-size: .92rem;
    }
    .install-card-sub {
      color: var(--muted);
      font-size: .78rem;
      margin-top: 1px;
    }

    /* ── DASHBOARD AUTH BAR ──
       Sits between the logo banner and the futebol cards. Two states:
       signed-out shows the Google button; signed-in shows avatar/name +
       Sair. Purely additive UI — no existing dashboard element moved. */
    .auth-bar {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .auth-google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: background .2s ease, box-shadow .2s ease;
    }
    .auth-google-btn:hover  { background: var(--green-l); }
    .auth-google-btn:active { box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .auth-bar-signed-in {
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      box-shadow: var(--sh);
    }
    .auth-user { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .auth-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      object-fit: cover;
    }
    .auth-avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: .9rem;
    }
    .auth-user-name {
      color: var(--text);
      font-weight: 600;
      font-size: .9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .auth-signout-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-signout-btn:hover { background: var(--bg); color: var(--text); }

    /* ── AUTH SCREENS — Login / Loading ──
       Shown by render() INSTEAD of the Dashboard while signed out or while
       Firebase hasn't confirmed the session yet (see render()'s auth gate).
       Reuses .dash-banner for the logo (same visual identity as the
       Dashboard) and renderAuthBar() for the actual Google button — no new
       button styling introduced here. */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px;
    }
    .auth-screen .dash-banner { margin-bottom: 22px; }
    .auth-screen-tagline {
      text-align: center;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 500;
      margin-bottom: 18px;
    }
    .auth-loading-spinner {
      width: 28px;
      height: 28px;
      margin: 8px auto 0;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      animation: auth-spin .8s linear infinite;
    }
    @keyframes auth-spin { to { transform: rotate(360deg); } }

    /* ── MAIN ── */
    .main {
      padding: 14px 14px 110px;
    }

    /* ── PLAYER CARD ── */
    .player-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 9px;
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .player-card.is-absent { opacity: .55; }

    .p-check {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .p-checkbox {
      width: 22px; height: 22px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    .pos-badge {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: .85rem;
      flex-shrink: 0;
    }
    .pos-G { background: #fef3c7; color: #92400e; }
    .pos-D { background: #dbeafe; color: #1e40af; }
    .pos-M { background: #ede9fe; color: #5b21b6; }
    .pos-A { background: #fee2e2; color: #991b1b; }

    .p-info     { flex: 1; min-width: 0; }
    .p-name     { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-stars    { font-size: .95rem; color: var(--warn); letter-spacing: 2px; margin-top: 1px; }
    .star-filled { color: var(--warn); }
    .star-empty  { color: var(--warn); opacity: .3; }
    .p-actions  { display: flex; gap: 6px; }

    .icon-btn {
      background: none; border: none; cursor: pointer;
      padding: 7px; border-radius: 8px;
      color: var(--muted); font-size: 1.05rem;
      transition: background .15s;
      line-height: 1;
    }
    .icon-btn:hover         { background: var(--border); }
    .icon-btn.del:hover     { background: #fee2e2; color: var(--danger); }

    /* ── ROSTER LIST — Sorteio (premium row) ──
       Scoped to .roster-list only, so the shared .player-card/.pos-badge/
       .p-check/.icon-btn rules above (still used by finance, late-add and
       history player lists) stay untouched. */
    .roster-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .roster-list .player-card {
      padding: 8px 12px;
      margin-bottom: 0;
      border-radius: 11px;
      border: 1px solid rgba(17,24,21,.055);
      box-shadow: 0 1px 2px rgba(17,24,21,.035);
      gap: 9px;
      transition: background .18s ease, box-shadow .18s ease;
    }
    .roster-list .player-card:hover {
      background: #fafbfa;
      box-shadow: 0 1px 3px rgba(17,24,21,.06);
    }

    /* Checkbox — custom-drawn so it reads as a small premium control
       instead of the bulky native accent-color box. Same input/onchange,
       purely a paint override. */
    .roster-list .p-check { padding: 4px; }
    .roster-list .p-checkbox {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px;
      margin: 0;
      border-radius: 5px;
      border: 1.5px solid #c9d3cd;
      background: #fff;
      position: relative;
      transition: background .15s ease, border-color .15s ease;
    }
    .roster-list .p-checkbox:checked {
      background: var(--green);
      border-color: var(--green);
    }
    .roster-list .p-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px; top: 1px;
      width: 4px; height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .roster-list .p-checkbox:active { transform: scale(.92); }

    .roster-list .pos-badge {
      width: 30px; height: 30px;
      font-weight: 700;
      font-size: .64rem;
      letter-spacing: .01em;
    }
    .roster-list .p-info { line-height: 1.15; }
    .roster-list .p-name {
      font-size: .875rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--text);
    }
    .roster-list .p-stars {
      font-size: .64rem;
      letter-spacing: 1px;
      margin-top: 1px;
      line-height: 1;
    }

    .roster-list .p-actions { gap: 1px; }
    .roster-list .icon-btn {
      padding: 6px;
      font-size: .95rem;
      border-radius: 7px;
      transition: background .15s ease, color .15s ease, transform .12s ease;
    }
    .roster-list .icon-btn:hover           { background: var(--green-l); color: var(--green-d); }
    .roster-list .icon-btn:active          { transform: scale(.92); }
    .roster-list .icon-btn.del:hover       { background: #fee2e2; color: var(--danger); }

    @media (max-width: 360px) {
      .roster-list .player-card { padding: 7px 10px; gap: 7px; }
      .roster-list .p-name { font-size: .84rem; }
    }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
    }
    .empty .ico { font-size: 3.2rem; margin-bottom: 14px; }
    .empty h3   { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 5px; }
    .empty p    { font-size: .875rem; }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 82px; right: 18px;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      border: none;
      font-size: 1.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(22,163,74,.45);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, box-shadow .15s;
      z-index: 90;
    }
    .fab:hover  { transform: scale(1.06); box-shadow: 0 6px 18px rgba(22,163,74,.55); }
    .fab:active { transform: scale(.94); }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: var(--surface);
      padding: 12px 14px;
      box-shadow: 0 -2px 10px rgba(0,0,0,.08);
      z-index: 100;
      display: flex; gap: 10px;
    }
    /* Extra bottom clearance for phone safe areas — opt-in modifier so
       existing .bottom-bar usages (Sortear, Ressortear/Histórico) keep
       their current padding untouched. */
    .bottom-bar.safe-bottom { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

    .btn-sort {
      flex: 1;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: var(--radius-s);
      padding: 14px 10px;
      font-size: .97rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s;
    }
    .btn-sort:hover     { background: var(--green-d); }
    .btn-sort:disabled  { background: #9ca3af; cursor: not-allowed; }
    .btn-share {
      background: #0ea5e9; color: #fff;
      border: none; border-radius: var(--radius-s);
      padding: 14px 12px;
      font-size: .95rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-share:hover { background: #0284c7; }

    /* Stacks the Sortear bar above the tabbar instead of overlapping it —
       only applied on the football's home (list) screen, where the tabbar
       is rendered. Result/dashboard screens keep bottom-bar at bottom:0. */
    .bottom-bar.above-tabbar { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); }

    /* ── SORTEIO CTA — action bar + button (premium) ──
       `.bottom-bar.above-tabbar` only ever renders on the draw screen, so
       scoping to that combo refines this bar/button without touching the
       plain `.bottom-bar`/`.btn-sort` used by other screens (e.g. the
       Ressortear button on the results screen). */
    .bottom-bar.above-tabbar {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border-top: 1px solid rgba(17,24,21,.06);
      box-shadow: 0 -8px 20px -14px rgba(17,24,21,.22);
      border-radius: 16px 16px 0 0;
      padding: 10px 14px;
    }
    .bottom-bar.above-tabbar .btn-sort {
      height: 46px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .01em;
      background: linear-gradient(180deg, var(--green) 0%, var(--green-d) 100%);
      box-shadow: 0 3px 10px -3px rgba(18,129,61,.4), 0 1px 2px rgba(0,0,0,.06);
      transition: box-shadow .18s ease, transform .12s ease, filter .18s ease;
    }
    .bottom-bar.above-tabbar .btn-sort:hover:not(:disabled) {
      filter: brightness(1.06);
      box-shadow: 0 5px 14px -3px rgba(18,129,61,.48), 0 1px 3px rgba(0,0,0,.08);
      transform: translateY(-1px);
    }
    .bottom-bar.above-tabbar .btn-sort:active:not(:disabled) {
      transform: translateY(0);
      filter: brightness(.98);
      box-shadow: 0 2px 6px -2px rgba(18,129,61,.35);
    }
    .bottom-bar.above-tabbar .btn-sort:disabled {
      background: #9ca3af;
      box-shadow: none;
    }
    .bottom-bar.above-tabbar .btn-sort:focus-visible {
      outline: 2px solid var(--green-d);
      outline-offset: 2px;
    }
    .btn-sort-ico { flex-shrink: 0; }
    .btn-sort-num { font-weight: 800; }

    /* ── RESSORTEAR — action bar + button (premium) ──
       Same treatment as the .bottom-bar.above-tabbar CTA above, scoped to
       .bottom-bar.result-bar (only ever rendered on the results screen) so
       the plain .bottom-bar (dashboard's "Adicionar pelada") and .btn-sort
       (draw screen's "Sortear" CTA) stay untouched. No tabbar sits under
       this screen, so bottom:0 / positioning is left exactly as-is. */
    .bottom-bar.result-bar {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border-top: 1px solid rgba(17,24,21,.06);
      box-shadow: 0 -8px 20px -14px rgba(17,24,21,.22);
      border-radius: 16px 16px 0 0;
      padding: 10px 14px;
    }
    .bottom-bar.result-bar .btn-sort {
      height: 46px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 700;
      letter-spacing: .01em;
      background: linear-gradient(180deg, var(--green) 0%, var(--green-d) 100%);
      box-shadow: 0 3px 10px -3px rgba(18,129,61,.4), 0 1px 2px rgba(0,0,0,.06);
      transition: box-shadow .18s ease, transform .12s ease, filter .18s ease;
    }
    .bottom-bar.result-bar .btn-sort:hover:not(:disabled) {
      filter: brightness(1.06);
      box-shadow: 0 5px 14px -3px rgba(18,129,61,.48), 0 1px 3px rgba(0,0,0,.08);
      transform: translateY(-1px);
    }
    .bottom-bar.result-bar .btn-sort:active:not(:disabled) {
      transform: translateY(0);
      filter: brightness(.98);
      box-shadow: 0 2px 6px -2px rgba(18,129,61,.35);
    }
    .bottom-bar.result-bar .btn-sort:disabled {
      background: #9ca3af;
      box-shadow: none;
    }
    .bottom-bar.result-bar .btn-sort:focus-visible {
      outline: 2px solid var(--green-d);
      outline-offset: 2px;
    }

    /* ── TAB BAR (Configurações / Ranking / Histórico / Financeiro) ── */
    .tabbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-width: 480px;
      margin: 0 auto;
      height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
      padding: 0 6px env(safe-area-inset-bottom, 0px);
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border-top: 1px solid rgba(17,24,21,.06);
      box-shadow: 0 -6px 16px -14px rgba(17,24,21,.25);
      z-index: 100;
      display: flex;
    }
    .tabbar-item {
      flex: 1;
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;
      margin: 6px 3px;
      border-radius: 12px;
      color: var(--muted);
      font-size: .68rem; font-weight: 500;
      transition: background .18s ease, color .18s ease, opacity .18s ease;
    }
    .tabbar-item .ti-ico { display: flex; align-items: center; justify-content: center; line-height: 1; }
    .tabbar-item .ti-ico svg { display: block; }
    .tabbar-item:hover   { color: var(--green-d); opacity: .9; }
    .tabbar-item:active  { background: var(--green-l); color: var(--green-d); }
    .tabbar-item.active  { color: var(--green-d); font-weight: 600; }

    /* ── MODAL ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.48);
      z-index: 200;
      display: flex; align-items: flex-end;
      backdrop-filter: blur(3px);
      animation: fadeIn .18s ease;
    }
    /* Keeps the bottom .tabbar menu visible/usable above whatever modal is
       open, instead of the modal's full-viewport overlay covering it —
       only how far down the overlay box extends changes here, every
       modal's own markup/handlers are untouched. `body.has-tabbar` is set
       centrally in render() from S.view (see there) — it's only ever 'list'
       (the football's roster screen, where .tabbar renders) that gets the
       class, so 'dashboard' (.tabbar never renders there — menu stays
       hidden exactly as before) and 'result' are unaffected. */
    body.has-tabbar .overlay {
      bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
    }
    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%; max-width: 480px;
      margin: 0 auto;
      padding: 22px 18px 32px;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp .22s ease;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 800; }
    .close-btn {
      background: var(--bg); border: none;
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* ── MENU-DRIVEN SCREEN SWITCH (Configurações/Ranking/Histórico/
       Financeiro) ──
       ROOT CAUSE of the navigation flicker: `.overlay`/`.modal` above carry
       an unconditional `animation` (fadeIn/slideUp). render() does one
       atomic `app.innerHTML = html` — there is no empty in-between frame —
       but every render() that shows a modal creates a BRAND NEW `.overlay`/
       `.modal` element, so switching directly between two tabbar screens
       (e.g. Ranking → Configurações, same click, S.modal going straight
       from one to the other) tore down the old modal and replayed the full
       fadeIn (backdrop 0→1 opacity) + slideUp (content translateY 100%→0)
       from scratch — the new screen was invisible/off-screen for a moment,
       which read as a flash/"piscar". True dialogs (Adicionar pelada, Novo
       jogador, Configurar sorteio, confirmações) keep that same fadeIn/
       slideUp completely untouched — this rule only fires when render()
       (see there) detects the PREVIOUS modal and the NEW one are both one
       of these four screens, via the `.screen-switch` class it adds to the
       fresh `.overlay`. In that case the backdrop doesn't need to fade in
       again (it was already visually there) and the panel only gets a
       quick, subtle settle-in — never dropping to invisible — instead of
       the full slide-up-from-below. Opening one of these four screens from
       no modal, or closing it, is unaffected (no `.screen-switch` class),
       so it still does the normal fadeIn+slideUp. */
    .overlay.screen-switch { animation: none; }
    .overlay.screen-switch .modal {
      animation: screenSwitchIn 160ms ease-out;
    }
    @keyframes screenSwitchIn {
      from { opacity: .55; transform: translateY(4px); }
      to   { opacity: 1;   transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .overlay.screen-switch .modal { animation: none; }
    }

    /* ── FORM ── */
    .fgroup { margin-bottom: 16px; }
    .flabel {
      display: block;
      font-size: .78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin-bottom: 7px;
    }
    .finput {
      width: 100%; padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius-s);
      font-size: 1rem; outline: none;
      transition: border-color .15s;
      background: var(--surface); color: var(--text);
    }
    .finput:focus { border-color: var(--green); }

    /* Position grid */
    .pos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pos-opt {
      padding: 10px 4px;
      border: 2px solid var(--border);
      border-radius: var(--radius-s);
      text-align: center; cursor: pointer;
      font-weight: 800; font-size: .85rem;
      transition: all .12s;
    }
    .pos-opt small { display: block; font-size: .6rem; font-weight: 500; margin-top: 2px; opacity: .8; }
    .pos-opt.sel   { border-color: var(--green); background: var(--green-l); color: var(--green-d); }

    /* Stars selector */
    .stars-row { display: flex; gap: 10px; }
    .star-opt {
      flex: 1; padding: 10px 4px;
      border: 2px solid var(--border);
      border-radius: var(--radius-s);
      text-align: center; cursor: pointer;
      font-size: 1rem; transition: all .12s;
    }
    .star-opt small { display: block; font-size: .65rem; margin-top: 3px; color: var(--muted); }
    .star-opt.sel   { border-color: var(--warn); background: #fef3c7; }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: var(--green); color: #fff;
      border: none; border-radius: var(--radius-s);
      padding: 14px; font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 10px;
      transition: background .15s;
    }
    .btn-primary:hover    { background: var(--green-d); }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-secondary {
      width: 100%;
      background: var(--bg); color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius-s);
      padding: 12px; font-size: .95rem; font-weight: 600;
      cursor: pointer; margin-top: 8px;
    }

    /* ── "ADICIONAR PELADA" MODAL ──
       .overlay/.modal/.modal-title/.close-btn/.fgroup/.finput/.btn-primary/
       .btn-secondary are all shared by seven other modals (addEdit jogador,
       Configurações, sort, Histórico, etc.) — every rule below is scoped
       under .addfb-overlay (added only to this modal's own outer wrapper)
       so none of it leaks into any other modal. Same fields, same
       validations, same onclick handlers as before — purely visual.
       Round 2: lighter/quieter finish — softer overlay, more diffuse
       shadow, smaller/lighter labels, no shadow on the primary button,
       no emoji on it, and the two buttons unified to the same height and
       type scale (only their color signals primary vs. secondary now). */
    .addfb-overlay { background: rgba(15,23,18,.50); }
    .addfb-overlay .modal {
      border-radius: 16px 16px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 16px 45px rgba(15,23,18,.12);
    }
    .addfb-overlay .modal-title {
      display: flex; align-items: center; gap: 6px;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .addfb-title-icon { font-size: .85em; opacity: .8; }
    .addfb-overlay .close-btn {
      color: var(--muted);
      transition: background .15s ease;
    }
    .addfb-overlay .close-btn:hover { background: var(--border); }
    .addfb-overlay .flabel {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .03em;
      margin-bottom: 9px;
    }
    .addfb-overlay .fgroup { margin-bottom: 20px; }
    .addfb-overlay .finput {
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .addfb-overlay .finput::placeholder { color: #8a958e; }
    .addfb-overlay .finput:focus {
      box-shadow: 0 0 0 3px rgba(22,163,74,.10);
    }
    .addfb-overlay .btn-primary,
    .addfb-overlay .btn-secondary {
      border-radius: 10px;
      padding: 14px;
      font-size: .9375rem;
      font-weight: 600;
      transition: background .2s ease;
    }
    .addfb-overlay .btn-primary { box-shadow: none; }
    .addfb-overlay .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .addfb-overlay .btn-secondary:hover { background: var(--bg); }

    /* ── "NOVO/EDITAR JOGADOR" MODAL ──
       .overlay/.modal/.modal-title/.close-btn/.fgroup/.flabel/.finput/
       .pos-grid/.pos-opt/.pos-G../.btn-primary are all shared with other
       modals (Ranking's category tabs reuse .pos-grid/.pos-opt; .pos-G/D/M/A
       are also the roster list avatar colors) — every rule below is scoped
       under .player-modal (added only to this modal's own outer wrapper) so
       none of it leaks anywhere else. Same fields, same onclick handlers,
       same savePlayer()/S.form state as before — purely visual. */
    .player-modal { background: rgba(15,23,18,.52); }
    .player-modal .modal {
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 -6px 40px rgba(15,23,18,.16);
      padding: 20px 18px 28px;
    }
    .player-modal .modal-title {
      display: flex; align-items: center; gap: 9px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .pmodal-icon {
      width: 28px; height: 28px; flex: none;
      display: flex; align-items: center; justify-content: center;
      background: var(--green-l);
      color: var(--green-d);
      border-radius: 9px;
    }
    .player-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .player-modal .close-btn:hover  { background: var(--border); }
    .player-modal .close-btn:active { transform: scale(.92); }

    .player-modal .flabel {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      margin-bottom: 7px;
    }
    .player-modal .fgroup { margin-bottom: 14px; }
    .player-modal .finput {
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .player-modal .finput::placeholder { color: #8a958e; }
    .player-modal .finput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(22,163,74,.10);
    }

    .player-modal .pos-grid { gap: 8px; }
    .player-modal .pos-opt {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 4px;
      line-height: 1.15;
      background: var(--bg);
      color: var(--text);
      transition: border-color .15s ease, background .15s ease, transform .12s ease;
    }
    .player-modal .pos-opt small { margin-top: 1px; font-size: .58rem; opacity: .65; }
    .player-modal .pos-opt:hover  { border-color: var(--green); }
    .player-modal .pos-opt:active { transform: scale(.97); }
    .player-modal .pos-opt.sel {
      border-color: var(--green);
      background: var(--green-l);
      color: var(--green-d);
    }

    .player-modal .stars-row { gap: 8px; }
    .player-modal .star-opt {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 4px;
      font-size: .88rem;
      line-height: 1.15;
      color: #c9902c;
      background: var(--bg);
      transition: border-color .15s ease, background .15s ease, transform .12s ease;
    }
    .player-modal .star-opt small { margin-top: 1px; font-size: .58rem; }
    .player-modal .star-opt:hover  { border-color: #e0b563; }
    .player-modal .star-opt:active { transform: scale(.97); }
    .player-modal .star-opt.sel {
      border-color: #d9a441;
      background: #fbf2df;
    }

    .player-modal .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 11px;
      margin-top: 6px;
      box-shadow: 0 3px 10px -3px rgba(18,129,61,.35);
      transition: background .18s ease, transform .12s ease, box-shadow .18s ease;
    }
    .player-modal .btn-primary:active:not(:disabled) { transform: scale(.98); }
    .player-modal .btn-primary:disabled { box-shadow: none; }

    /* ── CONFIRMATION MODAL SYSTEM (Remover jogador? / Resetar seleção?) ──
       Replaces window.confirm() for both actions. `.overlay`/`.modal`/
       `.modal-head`/`.modal-title`/`.close-btn` are shared by every other
       modal, so the centered layout, animation and sizing are scoped under
       `.confirm-modal` (added only to a confirmation modal's own outer
       wrapper); the rest of the markup (`.confirm-icon`, `.confirm-text`,
       `.confirm-actions`, `.confirm-btn*`) uses classes unique to this
       small family of modals, shared between the two so there's a single
       visual system rather than one-off styles per modal. Only the icon
       chip and the primary button swap color per action (red = destructive,
       green = neutral/reversible) — same removePlayer()/confirmRemovePlayer()
       and resetSelection()/confirmResetSelection() handlers as before,
       purely visual. */
    .confirm-modal {
      align-items: center;
      padding: 20px;
      background: rgba(15,23,18,.55);
    }
    .confirm-modal .modal {
      max-width: 320px;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(15,23,18,.22), 0 4px 14px rgba(15,23,18,.10);
      animation: confirmPopIn .18s ease;
    }
    .confirm-modal .modal-head { align-items: center; margin-bottom: 14px; }
    .confirm-modal .modal-title {
      display: flex; align-items: center; gap: 11px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .confirm-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .confirm-modal .close-btn:hover  { background: var(--border); }
    .confirm-modal .close-btn:active { transform: scale(.92); }

    @keyframes confirmPopIn {
      from { opacity: 0; transform: scale(.95) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .confirm-icon {
      width: 32px; height: 32px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
    }
    .confirm-icon.danger { background: #fdeceb; color: #c0392b; }
    .confirm-icon.accent { background: var(--green-l); color: var(--green-d); }

    .confirm-text {
      font-size: .9rem;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }
    .confirm-text strong { font-weight: 700; }
    .confirm-text-error {
      color: #c0392b;
      font-weight: 600;
      margin-top: -8px;
    }

    .confirm-actions { display: flex; gap: 10px; }
    .confirm-btn {
      flex: 1;
      height: 46px;
      border-radius: 11px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .confirm-btn:disabled { opacity: .6; cursor: not-allowed; }
    .confirm-btn-cancel {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .confirm-btn-cancel:hover   { background: var(--border); }
    .confirm-btn-cancel:active  { transform: scale(.98); }
    .confirm-btn-danger {
      background: #c65656;
      color: #fff;
      border: none;
      box-shadow: 0 2px 6px -2px rgba(198,86,86,.3);
    }
    .confirm-btn-danger:hover  { background: #b34a4a; }
    .confirm-btn-danger:active { transform: scale(.98); }
    .confirm-btn-primary {
      background: var(--green);
      color: #fff;
      border: none;
      box-shadow: 0 2px 6px -2px rgba(18,129,61,.3);
    }
    .confirm-btn-primary:hover  { background: var(--green-d); }
    .confirm-btn-primary:active { transform: scale(.98); }

    /* Number stepper */
    .stepper { display: flex; align-items: center; gap: 16px; }
    .step-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 1.2rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .step-btn:hover  { background: var(--green-l); border-color: var(--green); }
    .step-btn:active { transform: scale(.92); }
    .step-val { font-size: 1.5rem; font-weight: 800; min-width: 32px; text-align: center; color: var(--text); }

    /* Color inputs */
    .color-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .color-row label { font-size: .82rem; color: var(--muted); font-weight: 600; min-width: 56px; }

    /* Info note */
    .note {
      border-radius: var(--radius-s);
      padding: 10px 12px;
      font-size: .84rem;
      margin-bottom: 14px;
    }
    .note-ok  { background: var(--green-l); color: var(--green-d); }
    .note-info{ background: #fef3c7;         color: #92400e; }
    .note-err { background: #fee2e2;         color: #991b1b; }

    /* ── "CONFIGURAR SORTEIO" MODAL ──
       `.overlay`/`.modal`/`.modal-head`/`.modal-title`/`.close-btn`/`.fgroup`/
       `.btn-primary` are shared by other modals, and `.color-row` is also
       used by the Configurações modal's vest-color <select> rows — so
       everything below is scoped under `.sort-modal` (added only to this
       modal's own outer wrapper) or uses classes unique to this modal
       (`.sort-note*`, `.vest-*`). Same changePPT()/doSort() handlers and
       teamCount/selectedCount math as before — purely visual. */
    .sort-modal .modal {
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 -6px 40px rgba(15,23,18,.14);
      padding: 20px 18px 26px;
    }
    .sort-modal .modal-head { align-items: center; margin-bottom: 16px; }
    .sort-modal .modal-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .sort-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .sort-modal .close-btn:hover  { background: var(--border); }
    .sort-modal .close-btn:active { transform: scale(.92); }
    .sort-modal .fgroup { margin-bottom: 14px; }

    /* Selected-players summary — replaces the old single-line .note here
       with an icon + a two-line message (main figure, then the discreet
       "last team may have fewer" detail), same selectedCount/teamCount
       values as before. */
    .sort-note {
      display: flex; align-items: flex-start; gap: 8px;
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 14px;
    }
    .sort-note svg { flex: none; margin-top: 1px; }
    .sort-note-ok  { background: var(--green-l); color: var(--green-d); }
    .sort-note-err { background: #fee2e2; color: #991b1b; }
    .sort-note-main { font-size: .84rem; font-weight: 600; line-height: 1.3; }
    .sort-note-sub  { font-size: .74rem; opacity: .75; margin-top: 1px; line-height: 1.3; }

    /* Vest colors — compact, dot-led rows instead of the settings-style
       label+value list. */
    .vest-row {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 0;
    }
    .vest-dot {
      width: 11px; height: 11px; border-radius: 50%; flex: none;
      border: 1px solid rgba(0,0,0,.08);
    }
    .vest-team { font-size: .78rem; color: var(--muted); font-weight: 600; min-width: 46px; }
    .vest-color { font-size: .9rem; font-weight: 700; color: var(--text); }
    .vest-color.out { font-size: .84rem; font-weight: 500; color: var(--muted); }
    .sort-modal .vest-hint {
      display: flex; align-items: center; gap: 6px;
      font-size: .74rem;
      color: var(--muted);
      opacity: .8;
      margin-top: 6px;
    }
    .sort-modal .vest-hint svg { flex: none; }

    .sort-modal .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 46px;
      border-radius: 11px;
      box-shadow: 0 3px 10px -3px rgba(18,129,61,.35);
      transition: background .18s ease, transform .12s ease, box-shadow .18s ease;
    }
    .sort-modal .btn-primary:active:not(:disabled) { transform: scale(.98); }
    .sort-modal .btn-primary:disabled { box-shadow: none; }

    /* ── "CONFIGURAÇÕES DO FUTEBOL" MODAL ──
       `.overlay`/`.modal`/`.modal-head`/`.modal-title`/`.close-btn`/
       `.fgroup`/`.flabel`/`.finput`/`.color-row`/`.btn-primary`/
       `.btn-secondary` are all shared with other modals, so everything is
       scoped under `.settings-modal` (added only to this modal's own outer
       wrapper) or uses classes unique to it (`.settings-section`,
       `.vestcolor-*`, `.money-*`, `.field-hint`). The modal is a fixed
       header (`.modal-head`) over ONE scrolling `.modal-body` — fields,
       `.settings-footer` (Salvar/Cancelar) and `.settings-danger-zone`
       (Excluir grupo) all live inside it now, one continuous flow instead
       of a separate fixed block below the fields — same settingsForm
       fields/oninput/onchange and saveSettings()/closeModal() handlers as
       before, purely visual/structural for layout. */
    .settings-modal .modal {
      display: flex;
      flex-direction: column;
      max-height: 88vh;
      padding: 0;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 -6px 40px rgba(15,23,18,.14);
    }
    .settings-modal .modal-head {
      flex: none;
      padding: 18px 18px 0;
      margin-bottom: 12px;
      align-items: center;
    }
    .settings-modal .modal-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .settings-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .settings-modal .close-btn:hover  { background: var(--border); }
    .settings-modal .close-btn:active { transform: scale(.92); }

    .settings-modal .modal-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0 18px 4px;
    }
    .settings-section { margin-bottom: 18px; }
    .settings-section .sec-title { margin: 0 0 10px; }
    .settings-modal .fgroup { margin-bottom: 12px; }
    .settings-modal .flabel { margin-bottom: 6px; }
    .settings-modal .finput {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: .95rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .settings-modal .finput:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(22,163,74,.10);
    }
    .settings-modal .field-hint {
      font-size: .72rem;
      color: var(--muted);
      opacity: .8;
      line-height: 1.4;
      margin-top: 6px;
    }

    /* Vest colors — dot reflects the <select>'s current value; updated
       directly in the onchange handler (no extra render() call, same as
       every other field in this modal), alongside the same
       S.settingsForm.vestColors write as before. */
    .vestcolor-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0;
    }
    .vestcolor-dot {
      width: 14px; height: 14px; border-radius: 50%; flex: none;
      border: 1px solid rgba(0,0,0,.08);
    }
    .vestcolor-info { flex: 1; min-width: 0; }
    .vestcolor-label {
      display: block;
      font-size: .72rem; font-weight: 600; color: var(--muted);
      margin-bottom: 3px;
    }
    .settings-modal .vestcolor-select { margin: 0; }

    /* Monetary fields — purely a "R$" prefix overlay; value/oninput
       untouched. */
    .money-field { position: relative; }
    .money-prefix {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: .85rem; font-weight: 600; color: var(--muted);
      pointer-events: none;
    }
    .settings-modal .money-input { padding-left: 34px; }

    .settings-footer {
      margin: 8px -18px 0;
      padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid rgba(17,24,21,.06);
      background: var(--surface);
    }
    .settings-modal .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 46px;
      border-radius: 11px;
      margin-top: 0;
      box-shadow: 0 3px 10px -3px rgba(18,129,61,.35);
      transition: background .18s ease, transform .12s ease, box-shadow .18s ease;
    }
    .settings-modal .btn-primary:active { transform: scale(.98); }
    .settings-modal .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-top: 8px;
      transition: background .15s ease, color .15s ease;
    }
    .settings-modal .btn-secondary:hover { background: var(--bg); color: var(--text); }

    /* "Zona de perigo" — flows inside .modal-body right after
       .settings-footer, same single scroll as the fields above (see the
       comment on .settings-modal .modal). Negative side margins + its own
       matching horizontal padding let the border-top/background still
       bleed the full modal width, exactly as when this sat outside
       .modal-body — only where it scrolls changed, not how it looks. */
    .settings-danger-zone {
      margin: 0 -18px;
      padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .sec-title-danger { color: #c0392b; }
    .btn-danger-outline {
      width: 100%;
      height: 44px;
      margin-top: 10px;
      border-radius: 11px;
      background: #fdeceb;
      color: #c0392b;
      border: 1px solid rgba(192,57,43,.25);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s ease, transform .12s ease;
    }
    .btn-danger-outline:hover  { background: #fbdedb; }
    .btn-danger-outline:active { transform: scale(.98); }

    /* ── "RANKING" MODAL ──
       `.overlay`/`.modal`/`.modal-head`/`.modal-title`/`.close-btn` are
       shared with other modals, so the shell is scoped under
       `.ranking-modal`. The category selector and the player rows used to
       reuse `.pos-grid`/`.pos-opt` (shared with the Novo Jogador position
       picker) and `.player-card`/`.pos-badge` (shared with the roster list,
       finance and late-add lists) — a true segmented control and a
       compact ranked list don't fit those components' shapes, so they're
       rebuilt here with classes unique to the Ranking modal
       (`.rank-tabs`, `.rank-podium*`, `.rank-*`). Same
       computeRanking()/setRankingSort() data and sort order as before —
       purely visual. */
    .ranking-modal .modal {
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 -6px 40px rgba(15,23,18,.14);
      padding: 20px 18px 24px;
    }
    .ranking-modal .modal-head { align-items: center; margin-bottom: 16px; }
    .ranking-modal .modal-title { display: flex; align-items: center; gap: 10px; }
    .rank-title-main { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
    .rank-title-sub  { font-size: .72rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
    .ranking-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .ranking-modal .close-btn:hover  { background: var(--border); }
    .ranking-modal .close-btn:active { transform: scale(.92); }

    /* Segmented control — Gols / Assistências / Presença */
    .rank-tabs {
      display: flex;
      gap: 3px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .rank-tab {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 8px 6px;
      border-radius: 9px;
      font-size: .78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .rank-tab-ico { font-size: .85rem; line-height: 1; }
    .rank-tab:hover { color: var(--text); }
    .rank-tab.active {
      background: var(--surface);
      color: var(--green-d);
      box-shadow: 0 1px 3px rgba(17,24,21,.08);
    }

    /* Top 3 — compact podium (Gols/Assistências only; Presença skips this,
       see the "empates" note in the render function). */
    .rank-podium { margin-bottom: 6px; }
    .rank-podium-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px;
      border-radius: 12px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
    }
    .rank-podium-row:last-child { margin-bottom: 10px; }
    .rank-medal { font-size: 1.1rem; flex: none; width: 22px; text-align: center; }
    .rank-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .82rem;
      background: var(--bg); color: var(--muted);
    }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name {
      font-weight: 700; font-size: .92rem; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rank-stat { font-size: .74rem; color: var(--muted); margin-top: 1px; }

    .rank-podium-1 {
      background: var(--green-l);
      border-color: rgba(22,163,74,.22);
      padding: 11px 12px;
    }
    .rank-podium-1 .rank-avatar { width: 38px; height: 38px; font-size: .95rem; background: #fff; color: var(--green-d); }
    .rank-podium-1 .rank-name { font-size: 1rem; }
    .rank-podium-1 .rank-medal { font-size: 1.3rem; }

    /* Rest of the list — continuous, low-contrast rows (also used for the
       whole Presença category, ties included, with no podium framing). */
    .rank-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px solid rgba(17,24,21,.05);
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num {
      width: 20px; text-align: center; flex: none;
      font-size: .78rem; font-weight: 600; color: var(--muted);
    }
    .rank-avatar-sm {
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: .68rem; font-weight: 700;
      background: var(--bg); color: var(--muted);
    }
    .rank-name-sm {
      flex: 1; min-width: 0;
      font-size: .88rem; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rank-stat-sm { font-size: .78rem; color: var(--muted); flex: none; white-space: nowrap; }

    /* Ranking share — compact ghost button, same recipe as
       .history-btn-share/.finance-action-btn-secondary (own namespace per
       modal, same tokens, see those for why) so it reads as the same
       family of secondary action without coupling this modal's CSS to
       theirs. Right-aligned on its own row under the tabs so it never
       competes with the segmented control's width on narrow screens. */
    .rank-share-row { display: flex; justify-content: flex-end; margin: -6px 0 10px; }
    .rank-share-btn {
      display: flex; align-items: center; gap: 5px;
      border: none; background: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: .78rem; font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease, transform .12s ease;
    }
    .rank-share-btn svg { display: block; flex: none; }
    .rank-share-btn:hover { background: var(--border); color: var(--text); }
    .rank-share-btn:active { transform: scale(.94); }
    .rank-share-btn:focus-visible {
      outline: 2px solid var(--green-d);
      outline-offset: 2px;
    }
    @media (max-width: 360px) {
      .rank-share-btn { padding: 6px 8px; font-size: .74rem; }
    }

    /* ── "HISTÓRICO DE SORTEIOS" MODAL ──
       `.overlay`/`.modal`/`.modal-head`/`.modal-title`/`.close-btn`/`.empty`/
       `.confirm-icon` are shared with other modals, so the shell is scoped
       under `.history-modal` (added only to this modal's own outer
       wrapper). The list rows deliberately don't reuse `.team-card` — that
       class is also the plain bordered-card pattern for Financeiro
       summaries and the live sort result, so styling it here would bleed
       into those — a dedicated `.history-card`/`.history-date`/
       `.history-meta`/`.history-actions`/`.history-btn*` family is used
       instead (same idea as `.dash-card` next to `.team-card`). Split into
       a fixed header and a scrolling `.modal-body` (same pattern as
       `.settings-modal`) so the header stays put while the list scrolls.
       Same S.history data and viewHistoryRecord()/shareHistoryRecord()/
       deleteHistoryRecord()/closeModal()/overlayClose() handlers as
       before — purely visual. */
    .history-modal { background: rgba(15,23,18,.50); }
    .history-modal .modal {
      display: flex;
      flex-direction: column;
      max-height: 88vh;
      padding: 0;
      overflow: hidden;
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 -6px 40px rgba(15,23,18,.14);
    }
    .history-modal .modal-head {
      flex: none;
      padding: 20px 18px 0;
      margin-bottom: 14px;
      align-items: center;
    }
    .history-modal .modal-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .history-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .history-modal .close-btn:hover  { background: var(--border); }
    .history-modal .close-btn:active { transform: scale(.92); }

    .history-modal .modal-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0 18px calc(20px + env(safe-area-inset-bottom, 0px));
    }
    .history-modal .empty { padding: 44px 10px 8px; }

    .history-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px 17px;
      margin-bottom: 10px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .history-card:last-child { margin-bottom: 0; }
    .history-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--green);
      opacity: .6;
    }
    .history-card:hover {
      border-color: rgba(22,163,74,.35);
      box-shadow: 0 3px 12px -5px rgba(17,24,21,.14);
    }
    .history-date { font-weight: 800; font-size: .98rem; color: var(--text); }
    .history-meta { font-size: .8rem; color: var(--muted); margin: 2px 0 12px; }
    .history-actions {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
      padding-top: 10px;
      border-top: 1px solid rgba(17,24,21,.06);
    }
    .history-btn {
      display: flex; align-items: center; gap: 5px;
      border: none; background: none;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: .82rem; font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease, transform .12s ease;
    }
    .history-btn svg { display: block; flex: none; }
    .history-btn:active { transform: scale(.94); }
    .history-btn-view {
      color: var(--green-d);
      background: var(--green-l);
    }
    .history-btn-view:hover { background: #cdf3da; }
    .history-btn-share:hover { background: var(--border); color: var(--text); }
    /* Ghost/subtle by design — resting state is explicitly transparent
       (no red fill at rest), text/icon a desaturated red (same tone as
       .confirm-icon.danger's resting state) so the destructive action
       reads as available without competing with "Ver". The hover tint is
       intentionally much fainter than the shared #fee2e2 danger-hover
       (used by .icon-btn.del/.roster-list .icon-btn.del) so a lingering
       :hover never reads as an "alarmed" button. Guarded behind
       `(hover: hover)` so a tap on touch devices can't leave that tint
       "stuck" the way a plain :hover would. Deletion itself now opens
       renderHistoryDeleteConfirm() (a real modal, not window.confirm()),
       so the cursor is over that dialog's own Cancelar button on
       Cancel/close, not this one. */
    .history-btn-del { color: #c0392b; background: transparent; }
    @media (hover: hover) {
      .history-btn-del:hover { background: #fef2f2; color: var(--danger); }
    }
    .history-btn-del:active { background: #fee2e2; color: #b91c1c; }
    .history-btn-del:focus-visible {
      outline: 2px solid var(--danger);
      outline-offset: 2px;
    }

    @media (max-width: 360px) {
      .history-card { padding: 12px 12px 10px 15px; }
      .history-actions { gap: 0; }
      .history-btn { padding: 6px 7px; font-size: .78rem; }
    }

    /* ── "FINANCEIRO" MODAL (dashboard screen only) ──
       `.overlay`/`.modal`/`.modal-head`/`.modal-title`/`.close-btn`/
       `.confirm-icon`/`.sec-title`/`.empty`/`.btn-secondary`/`.finput` are
       shared with other modals, so the shell is scoped under
       `.finance-modal` (added only to renderFinanceDashboard()'s own outer
       wrapper — the Arquivadas/Detail screens reached from here are out of
       this pass's scope and keep the plain base modal look). The summary
       card and the per-pelada list don't reuse `.team-card` — that class
       is also the live sort result's card — so dedicated
       `.finance-summary-*`/`.finance-card`/`.finance-action-btn*` families
       are used instead, mirroring the same recipe `.history-card`/
       `.history-btn*` already established (own namespace per modal, same
       tokens). Same computeFinanceOverview()/financeForRecord()/
       formatBRL() data and setFinanceFilter()/openFinanceDetail()/
       shareFinanceRecord()/openFinanceArchive() handlers as before —
       purely visual. */
    .finance-modal .modal {
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--border);
      box-shadow: 0 -6px 40px rgba(15,23,18,.14);
      padding: 20px 18px 26px;
    }
    .finance-modal .modal-head { align-items: center; margin-bottom: 18px; }
    .finance-modal .modal-title { display: flex; align-items: center; gap: 10px; }
    .finance-title-main { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
    .finance-title-sub  { font-size: .72rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
    .finance-modal .close-btn {
      color: var(--muted);
      transition: background .15s ease, transform .12s ease;
    }
    .finance-modal .close-btn:hover  { background: var(--border); }
    .finance-modal .close-btn:active { transform: scale(.92); }

    .finance-modal .sec-title:first-of-type { margin-top: 0; }

    /* Ano/Mês filters — same <select>/onchange as before, just laid out
       30/70 with a softer, slightly recessed finish than the default
       .finput. */
    .finance-filters { display: flex; gap: 8px; margin-bottom: 20px; }
    .finance-filters select { flex: 1; }
    .finance-filters select:first-child { flex: 0 0 30%; }
    .finance-modal .finput {
      margin: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      font-size: .9rem;
      transition: border-color .15s ease;
    }
    .finance-modal .finput:focus { border-color: var(--green); }

    /* Controle Financeiro — the balance is the largest, most prominent
       figure in the card; Recebido/Campos sit below a divider as
       secondary line items. */
    .finance-summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: 0 2px 10px -6px rgba(17,24,21,.10);
    }
    .finance-summary-period {
      font-size: .78rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .finance-summary-label { font-size: .82rem; color: var(--muted); margin-top: 10px; }
    .finance-summary-balance { font-size: 1.9rem; font-weight: 800; line-height: 1.2; margin-top: 2px; }
    .finance-summary-rows {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .finance-summary-row { display: flex; justify-content: space-between; align-items: baseline; font-size: .88rem; }
    .finance-summary-row span { color: var(--muted); }

    /* Acerto de Contas — one card per pelada. */
    .finance-card {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px 12px 17px;
      margin-top: 10px;
    }
    .finance-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--green);
      opacity: .6;
    }
    .finance-card-title { font-weight: 800; font-size: .95rem; color: var(--text); }
    .finance-card-meta { font-size: .8rem; color: var(--muted); margin: 2px 0 12px; }
    .finance-card-values { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .finance-card-value-row { display: flex; justify-content: space-between; align-items: baseline; font-size: .85rem; }
    .finance-card-value-row span { color: var(--muted); font-size: .8rem; }
    .finance-card-actions {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
      padding-top: 10px;
      border-top: 1px solid rgba(17,24,21,.06);
    }
    .finance-action-btn {
      display: flex; align-items: center; gap: 5px;
      border: none; background: none;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: .82rem; font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s ease, color .15s ease, transform .12s ease;
    }
    .finance-action-btn svg { display: block; flex: none; }
    .finance-action-btn:active { transform: scale(.94); }
    .finance-action-btn-primary { color: var(--green-d); background: var(--green-l); }
    .finance-action-btn-primary:hover { background: #cdf3da; }
    .finance-action-btn-secondary:hover { background: var(--border); color: var(--text); }

    .finance-modal .btn-secondary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--border);
      border-radius: 11px;
      transition: background .15s ease, color .15s ease;
    }
    .finance-modal .btn-secondary:hover { background: var(--border); color: var(--text); }

    @media (max-width: 360px) {
      .finance-card { padding: 12px 12px 10px 15px; }
      .finance-card-actions { gap: 0; }
      .finance-action-btn { padding: 6px 7px; font-size: .78rem; }
      .finance-summary-balance { font-size: 1.7rem; }
    }

    /* ── RESULT ── */
    .back-btn {
      background: none; border: none; color: #fff;
      font-size: 1.4rem; cursor: pointer; padding: 0 8px 0 0;
      line-height: 1;
    }

    .team-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 14px 10px;
      margin-bottom: 12px;
      box-shadow: var(--sh);
      border-left: 5px solid var(--green);
    }
    .team-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .team-name  { font-weight: 800; font-size: .97rem; }
    .team-pts   {
      font-size: .8rem; font-weight: 700;
      background: var(--green-l); color: var(--green-d);
      padding: 2px 8px; border-radius: 20px;
    }
    .team-card.team-out { background: #f9fafb; }
    .team-card.team-out .team-name { color: var(--muted); }
    .team-out-tag {
      font-size: .68rem; font-weight: 700;
      color: var(--muted); margin-left: 7px;
      text-transform: uppercase; letter-spacing: .04em;
    }

    /* ── LISTA DE TIMES — resultado do sorteio (premium) ──
       `.team-card`/`.team-head`/`.team-name`/`.team-pts`/`.team-out-tag`
       above are also reused as a plain bordered-card pattern elsewhere
       (Financeiro summaries, the Histórico list rows) with none of the
       player-list markup below — so the card shell + header refinements
       are scoped under `.roster-team-card` (added only in renderTeamCard(),
       shared by the live result screen and the Histórico "Ver" detail,
       which already reuses this exact component by design). `.tplayer`/
       `.sm-badge`/`.pname`/`.pstars`/`.late-tag`/`.reserve-card` have no
       other consumers, so they're refined directly. Same teams/players/
       stars data and doSort()/openSort() flow as before — purely visual. */
    .roster-team-card {
      border-radius: 16px;
      padding: 13px 16px 5px;
      margin-bottom: 14px;
      border-left-width: 4px;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(17,24,21,.05);
    }
    .roster-team-card .team-head {
      margin-bottom: 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(17,24,21,.055);
    }
    .roster-team-card .team-name {
      display: flex; align-items: center; gap: 7px;
      font-size: .95rem;
      font-weight: 700;
    }
    .team-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .roster-team-card .team-pts {
      font-size: .76rem;
      font-weight: 700;
      background: var(--bg);
      color: var(--muted);
      padding: 3px 9px;
    }
    .roster-team-card .team-out-tag {
      font-size: .62rem;
      margin-left: 0;
      background: var(--bg);
      padding: 2px 7px;
      border-radius: 20px;
    }

    /* Discreet marker for players added to a saved history record after
       the original draw (see confirmAddLatePlayers). */
    .late-tag {
      font-size: .68rem; font-weight: 700;
      color: var(--warn); margin-left: 6px;
      white-space: nowrap;
    }

    .tplayer {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px solid rgba(17,24,21,.05);
    }
    .tplayer:last-child { border-bottom: none; }
    .tplayer .pname     { flex: 1; font-size: .88rem; font-weight: 600; }
    .tplayer .pstars    { font-size: .78rem; color: var(--warn); letter-spacing: .5px; }

    /* Compact goals/assists steppers on the history detail's player rows —
       wraps to its own line on narrow screens instead of squeezing. */
    .tplayer.stat-row { flex-wrap: wrap; row-gap: 6px; }
    .stat-stepper { display: flex; align-items: center; gap: 4px; }
    .stat-btn {
      width: 22px; height: 22px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg);
      font-size: .85rem; font-weight: 700; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text); flex-shrink: 0;
    }
    .stat-btn:hover { background: var(--green-l); border-color: var(--green); }
    .stat-val { font-size: .78rem; font-weight: 700; min-width: 34px; text-align: center; white-space: nowrap; }

    .sm-badge {
      width: 26px; height: 26px; font-size: .66rem;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; flex-shrink: 0;
    }

    .reserve-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 5px 16px 3px;
      box-shadow: 0 1px 3px rgba(17,24,21,.05);
      border-left: 4px solid #9ca3af;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .reserve-title {
      font-weight: 800; font-size: .97rem;
      color: var(--muted); margin-bottom: 10px;
    }

    .sec-title {
      font-size: .75rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--muted); margin: 16px 0 8px;
    }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ──────────────────────────────────────────────
//  CONSTANTS & STATE
// ──────────────────────────────────────────────

// Only the first two teams sorted wear a vest — everyone drafted after
// that is a "time de fora" waiting to rotate in. WHICH two colors those
// are is configurable per football (football.vestColors, edited via
// Configurações — see openSettings/saveSettings); this is just the
// available palette and the fallback for footballs that don't have it
// set yet. The index-based rule itself (team 1/2 = vest, 3+ = Fora) is
// untouched — see runSort().
const VEST_COLOR_PALETTE = {
  Amarelo:  '#eab308',
  Azul:     '#2563eb',
  Vermelho: '#dc2626',
  Verde:    '#16a34a',
  Laranja:  '#ea580c',
  Branco:   '#d1d5db',
  Preto:    '#111827'
};
const VEST_COLOR_EMOJI = {
  Amarelo: '🟡', Azul: '🔵', Vermelho: '🔴', Verde: '🟢',
  Laranja: '🟠', Branco: '⚪', Preto: '⚫'
};
const DEFAULT_VEST_COLORS = { team1: 'Amarelo', team2: 'Azul' };
const OUT_ACCENT = '#9ca3af';
// Small helper so inline onchange="" handlers (evaluated later by the
// browser) don't have to rely on top-level const visibility — plain
// function declarations are always reachable there.
function vestDotColor(color) { return VEST_COLOR_PALETTE[color] || OUT_ACCENT; }

let S = {
  view:          'dashboard', // 'dashboard' | 'list' | 'result'
  modal:         null,        // null | 'addEdit' | 'sort' | 'history' | 'addFootball' | 'settings' | 'ranking' | 'finance' | 'confirmDelete' | 'confirmReset' | 'deleteFootballConfirm'
  // Futebóis (jogos) cadastrados — metadata only, kept separate from the
  // player/selection/history data below, which lives under Firestore paths
  // keyed by football id (users/{uid}/footballs/{footballId}/...). Isolation
  // between futebóis is achieved entirely at the persistence boundary — everything else
  // (algorithm, checkboxes, history logic) keeps operating on S.players/
  // S.selectedPlayerIds/S.history exactly as before, unchanged.
  footballs:          [],
  currentFootballId:  null,
  footballForm:       { name: '', dayOfWeek: '', time: '', location: '' },
  // Edit form for Configurações — populated from the current football
