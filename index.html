  // when the modal opens (see openSettings), saved back onto it (see
  // saveSettings). Same name/dayOfWeek/time/location shape as footballForm,
  // plus the two vest colors.
  settingsForm:       { name: '', dayOfWeek: '', time: '', location: '', vestColors: { team1: 'Amarelo', team2: 'Azul' } },
  players:       [],
  editId:        null,
  form:          { name: '', position: 'M', stars: 2 },
  // id of the player pending removal, shown by the "Remover jogador?"
  // confirmation modal, or null when it's closed. Set by
  // requestRemovePlayer(), read by renderConfirmDelete()/confirmRemovePlayer().
  confirmDeleteId: null,
  // true while deleteFootballConfirmed() is awaiting the Firestore delete
  // for the "Excluir grupo" danger-zone action (see Configurações) —
  // disables the confirm-modal buttons so a slow/offline delete can't be
  // triggered twice. Error message for that same flow, or null when
  // there's nothing to show — set on failure, read by
  // renderDeleteFootballConfirm(); both reset by closeModal()/
  // requestDeleteFootball().
  deletingFootball: false,
  deleteFootballError: null,
  cfg: {
    playersPerTeam:  5
  },
  result: null,
  // Presence for the current pelada — separate from player records, but
  // now persisted under its own key (see loadPlayers/saveSelectedPlayerIds)
  // so it survives a reload. Cleared only via resetSelection().
  selectedPlayerIds: new Set(),
  // Saved draw snapshots — separate storage from players/selection (see
  // loadHistory/persistHistory). Independent of S.result: editing a player
  // later must never change an already-saved record.
  history: [],
  // id of the S.history record that matches the CURRENTLY displayed
  // S.result, or null if this result hasn't been saved yet. Reset to null
  // every time a new draw runs (see doSort). Drives the Salvar/✓ Salvo button.
  savedResultId: null,
  // id of the history record being viewed inside the 'history' modal, or
  // null to show the list of records instead.
  historyViewId: null,
  // Same idea as historyViewId, one level deeper: id of the history record
  // currently receiving late-arriving players via the "➕ Adicionar" flow
  // (see openAddLatePlayers), or null. addLateSelections holds the ids of
  // players currently checked in that list (players already part of the
  // record are shown too, but locked — never end up in here).
  addLateRecordId: null,
  addLateSelections: new Set(),
  // id of the history record pending deletion, shown by the "Excluir
  // sorteio?" confirmation modal (replaces the old window.confirm() step),
  // or null when it's closed. Set by requestDeleteHistoryRecord(), read by
  // renderHistoryDeleteConfirm()/deleteHistoryRecord() — same nesting
  // pattern as historyViewId/addLateRecordId.
  historyDeleteId: null,
  // true right after "Salvar estatísticas" succeeds for the record
  // currently open in the history detail view — drives the discreet
  // confirmation note. Cleared whenever a stat changes again or the view
  // changes, so it never shows stale for a different record.
  statsSavedFlash: false,
  // Which stat the 🏅 Ranking list is currently sorted by.
  rankingSortBy: 'goals',
  // Message shown by the discreet "✓ Ranking copiado" note under the
  // share button, or null when hidden. Set by shareRanking()'s clipboard
  // fallback, self-clears via rankingShareTimer — see there.
  rankingShareFlash: null,
  // id of the history record whose 💰 Financeiro detail is being viewed,
  // or null to show the Financeiro dashboard (summary + list by date)
  // instead — same nesting pattern as historyViewId/addLateRecordId.
  financeRecordId: null,
  // Which month/year the Financeiro dashboard is currently filtered to —
  // pure UI state, never persisted. Reset to the real current month/year
  // every time the Financeiro menu is opened (openFinance()). Grouping is
  // derived from each record's own gameDate/createdAt (see
  // recordMonthYear()) — no new field is stored on the record for this.
  financeFilterYear: null,
  financeFilterMonth: null,
  // 'dashboard' (filtered period + its peladas) or 'archive' (past months
  // grouped by year) — same nesting idea as financeRecordId.
  financeView: 'dashboard',
  // Firebase Auth user — pure runtime/UI state, never persisted here and
  // never read by the players/history/football logic above. Three states,
  // not two: `undefined` (initial — Firebase hasn't confirmed yet), `null`
  // (confirmed signed out), or a Firebase User object (confirmed signed
  // in). render() gates on this to pick Loading/Login/Dashboard — see the
  // "FIREBASE AUTH (UI bridge)" section below. Kept in sync by
  // onFirebaseAuthChange(), called from the Firebase module script at the
  // bottom of the page.
  authUser: undefined,
  // true while footballs/players/history/selection are being fetched from
  // Firestore (see loadFootballs()/loadPlayers()/loadHistory(), all async
  // since Etapa 4) — set around onFirebaseAuthChange()'s loadFootballs()
  // call and openFootball()'s loadPlayers()/loadHistory() calls. render()
  // gates on this the same way it gates on authUser, showing the same
  // loading spinner instead of a stale/empty Dashboard or List while the
  // fetch is in flight.
  dataLoading: false,
  // PWA install affordance — pure runtime/UI state, never persisted (no
  // localStorage, no Firestore). Holds the real `beforeinstallprompt` event
  // while the browser keeps it valid, so the Home's own "Instalar Tira
  // Time" card can trigger the browser's native install flow later via
  // installApp() — see the "PWA INSTALL" section near the end of this
  // script. Stays null on browsers/platforms that never fire the event
  // (e.g. iOS Safari), so the card simply never appears there.
  pwaInstallEvent: null,
  // Set true once the `appinstalled` event fires, so the card stays hidden
  // for the rest of the session even after pwaInstallEvent is cleared.
  pwaInstalled: false
};

// ──────────────────────────────────────────────
//  PERSISTENCE
// ──────────────────────────────────────────────

// Firestore-only read (Etapa 4) — localStorage is never consulted here,
// and a Firestore failure never falls back to it: S.players/
// S.selectedPlayerIds simply end up empty (see the catches below), same as
// "logged out"/"no data yet".
async function loadPlayers() {
  const uid = firestoreUid();
  if (!uid || !S.currentFootballId || !window.firestoreSync) {
    S.players = [];
    S.selectedPlayerIds = new Set();
    return;
  }

  try {
    S.players = await window.firestoreSync.readPlayers(uid, S.currentFootballId);
  } catch (err) {
    console.error('Falha ao carregar jogadores do Firestore:', err);
    S.players = [];
  }

  let savedIds = [];
  try {
    savedIds = await window.firestoreSync.readSelection(uid, S.currentFootballId);
  } catch (err) {
    console.error('Falha ao carregar seleção do Firestore:', err);
  }

  // Drop ids for players that no longer exist (e.g. deleted since the
  // selection was saved) — S.players stays the sole source of truth.
  const validIds = new Set(S.players.map(p => p.id));
  S.selectedPlayerIds = new Set(savedIds.filter(id => validIds.has(id)));
  saveSelectedPlayerIds(); // persist the pruned set back, dropping stale ids
}

// Grava jogadores exclusivamente no Firestore (Etapa 5 — o dual-write em
// localStorage foi removido; load*() já lia só do Firestore desde a Etapa 4).
function persist() {
  syncPlayersToFirestore();
}

// Grava seleção/presença exclusivamente no Firestore (Etapa 5 — mesma
// remoção do dual-write em localStorage que persist(), acima).
function saveSelectedPlayerIds() {
  syncSelectionToFirestore();
}

// Firestore-only read (Etapa 4) — see loadPlayers() above for the same
// rationale (no localStorage read, no fallback on failure).
async function loadHistory() {
  const uid = firestoreUid();
  if (!uid || !S.currentFootballId || !window.firestoreSync) {
    S.history = [];
    return;
  }

  try {
    S.history = await window.firestoreSync.readHistory(uid, S.currentFootballId);
  } catch (err) {
    console.error('Falha ao carregar histórico do Firestore:', err);
    S.history = [];
  }
}

// Grava histórico exclusivamente no Firestore (Etapa 5 — mesma remoção do
// dual-write em localStorage que persist(), acima).
function persistHistory() {
  syncHistoryToFirestore();
}

// ──────────────────────────────────────────────
//  FUTEBÓIS (dashboard) — metadata + isolation boundary
// ──────────────────────────────────────────────

// Firestore-only read (Etapa 4) — see loadPlayers() above for the same
// rationale (no localStorage read, no fallback on failure). Called only
// from onFirebaseAuthChange() once a real signed-in user is confirmed —
// there is no uid to read with while S.authUser is null/undefined, so this
// is never called in that state (see the "FIREBASE AUTH (UI bridge)"
// section, and the BOOT section at the bottom of the file).
async function loadFootballs() {
  const uid = firestoreUid();
  if (!uid || !window.firestoreSync) { S.footballs = []; return; }

  try {
    S.footballs = await window.firestoreSync.readFootballs(uid);
  } catch (err) {
    console.error('Falha ao carregar peladas do Firestore:', err);
    S.footballs = [];
  }

  // Backfill for futebóis created before dayOfWeek/time/vestColors/
  // pricePerPlayer/fieldCost existed (older ones only had a free-form
  // "date"; earlier versions had no vest colors or finance defaults at
  // all). Never invents a value beyond the documented defaults (empty/
  // Amarelo-Azul/0) — the old "date" field itself is left alone, just no
  // longer read/shown. pricePerPlayer/fieldCost here are only the
  // FOOTBALL-level defaults for new peladas — each saved history record
  // snapshots its own value at save time (see saveResultToHistory) and is
  // never touched by this backfill.
  let needsResave = false;
  S.footballs.forEach(f => {
    if (f.dayOfWeek === undefined)     { f.dayOfWeek = '';     needsResave = true; }
    if (f.time === undefined)          { f.time = '';          needsResave = true; }
    if (!f.vestColors)                 { f.vestColors = { ...DEFAULT_VEST_COLORS }; needsResave = true; }
    if (f.pricePerPlayer === undefined) { f.pricePerPlayer = 0; needsResave = true; }
    if (f.fieldCost === undefined)      { f.fieldCost = 0;      needsResave = true; }
    if (f.pixKey === undefined)         { f.pixKey = '';        needsResave = true; }
    if (f.pixRecipientName === undefined) { f.pixRecipientName = ''; needsResave = true; }
  });
  if (needsResave) persistFootballs();
}

// Grava futebóis exclusivamente no Firestore (Etapa 5 — mesma remoção do
// dual-write em localStorage que persist(), acima).
function persistFootballs() {
  syncFootballsToFirestore();
}

// ──────────────────────────────────────────────
//  FIRESTORE — sincronização de escrita
// ──────────────────────────────────────────────
//
// Cada helper abaixo é chamado logo depois do persist*()/save*() local
// correspondente e dispara uma escrita best-effort no Firestore, via
// window.firestoreSync (module script no fim do arquivo). Toda chamada é
// fire-and-forget — nunca aguardada aqui — e o próprio firestoreSync
// engole qualquer rejeição (offline, deslogado, regras de segurança), de
// forma que uma falha de escrita no Firestore nunca afeta o comportamento
// normal do app. load*() (acima) lê exclusivamente do Firestore desde a
// Etapa 4 — nada aqui é lido de volta para S.

function firestoreUid() {
  const user = window.firebaseAuth && window.firebaseAuth.currentUser;
  return user ? user.uid : null;
}

function syncFootballsToFirestore() {
  const uid = firestoreUid();
  if (!uid || !window.firestoreSync) return;
  window.firestoreSync.writeFootballs(uid, S.footballs);
}

function syncPlayersToFirestore() {
  const uid = firestoreUid();
  if (!uid || !S.currentFootballId || !window.firestoreSync) return;

function uid() {

// ──────────────────────────────────────────────
//  ALGORITHM — balanced draft (stars + position + randomness)
// ──────────────────────────────────────────────
//
// Strategy: run many randomized constructive trials — each one goes
// round-by-round through the positions (G, D, M, A), always sending the
// next player to the team currently weakest for that position (ties
// broken by total stars, then randomly). Every trial is compared using
// a strict priority order (see comparePriority): team size is a
// structural constraint (always satisfied by construction), then star
// balance, then position balance, then avoiding an exact repeat of the
// previous result — never a weighted blend, so a lower-priority
// criterion can never be "traded off" against a higher one. Keep the
// best, picking randomly among equally good trials, then polish the
// winner with a small hill-climbing swap search. Players beyond
// numTeams*playersPerTeam never compete as a "team" — they simply never
// get a slot and end up as reserves, decided only after titulars are set.

const POSITIONS = ['G', 'D', 'M', 'A'];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// One randomized construction: goes round-by-round taking one player
// from each position queue (G, then D, then M, then A) so that no
// single position can fill every remaining slot and starve the others
// when it has a big headcount — e.g. a squad with many defenders and
// few midfielders would otherwise leave teams with zero midfielders.
// Each pick goes to the team currently weakest for that position
// (ties broken by total stars, then randomly). Whatever doesn't fit
// once every team is full becomes a reserve.
function buildCandidate(players, numTeams, playersPerTeam) {
  // Every team fills to playersPerTeam except the last one, which only
  // gets whatever's left over (never redistributed evenly — 24 players
  // at "7 per team" is 7/7/7/3, not 6/6/6/6). numTeams is always exactly
  // Math.ceil(players.length / playersPerTeam) (see runSort()), so total
  // capacity always equals players.length exactly and reserves naturally
  // stay empty — nobody is left out just because of team-count math.
  const teams = Array.from({ length: numTeams }, (_, i) => {
    const isLast = i === numTeams - 1;
    const capacity = isLast ? players.length - (numTeams - 1) * playersPerTeam : playersPerTeam;
    return {
      players: [],
      totalStars: 0,
      posCount: { G: 0, D: 0, M: 0, A: 0 },
      slotsLeft: capacity
    };
  });
  const reserves = [];

  const queues = {};
  for (const pos of POSITIONS) {
    queues[pos] = shuffle(players.filter(p => p.position === pos))
      .sort((a, b) => b.stars - a.stars); // stable sort: ties stay in random order
  }

  let left = players.length;
  while (left > 0) {
    for (const pos of POSITIONS) {
      const queue = queues[pos];
      if (!queue.length) continue;
      const player = queue.shift();
      left--;

      const open = teams.filter(t => t.slotsLeft > 0);
      if (open.length === 0) { reserves.push(player); continue; }

      const minPos  = Math.min(...open.map(t => t.posCount[pos]));
      const byPos   = open.filter(t => t.posCount[pos] === minPos);
      const minStar = Math.min(...byPos.map(t => t.totalStars));
      const byStar  = byPos.filter(t => t.totalStars === minStar);
      const team    = byStar[Math.floor(Math.random() * byStar.length)];

      team.players.push(player);
      team.totalStars += player.stars;
      team.posCount[pos]++;
      team.slotsLeft--;
    }
  }

  return { teams, reserves };
}

// Composition fingerprint, independent of team order/index.
function partitionKey(teams) {
  return teams
    .map(t => t.players.map(p => p.id).sort().join(','))
    .sort()
    .join('|');
}

// Explicit objective — one number per priority level (team-size is a
// structural constraint, guaranteed by buildCandidate, so it needs no
// score term here):
//   1) starDiff    — max-min of AVERAGE stars per player between teams.
//                    Must be the average, not the raw total: teams can now
//                    legitimately differ in size (the last team is often
//                    smaller — see buildCandidate), and comparing raw sums
//                    across different-sized teams is not "balance" at all
//                    — minimizing a small team's sum-gap to the big teams'
//                    sums literally rewards stuffing it with the highest-
//                    star players available, the opposite of fair. Using
//                    the average instead is a strict generalization: for
//                    equal-sized teams (the common case) it's just the old
//                    sum-based value scaled by a constant, so it ranks
//                    candidates identically — this only changes behavior
//                    exactly where team sizes differ.
//   2) posPenalty  — how uneven each position (G/D/M/A) is across teams,
//                    squared per position before summing so imbalance
//                    spread over several positions beats the same total
//                    imbalance dumped onto a single one
//   3) repeat      — 1 if this is exactly the previous result, else 0
function scoreTeams(teams, prevKey) {
  const starAverages = teams.map(t => t.totalStars / t.players.length);
  const starDiff = Math.max(...starAverages) - Math.min(...starAverages);

  let posPenalty = 0;
  for (const pos of POSITIONS) {
    const counts = teams.map(t => t.posCount[pos]);
    const diff = Math.max(...counts) - Math.min(...counts);
    posPenalty += diff * diff;
  }

  const repeat = (prevKey && partitionKey(teams) === prevKey) ? 1 : 0;

  return { starDiff, posPenalty, repeat };
}

// Strict lexicographic comparison — a lower-priority criterion is only
// ever consulted when every higher-priority one is exactly tied, so
// position balance can never be sacrificed to shave a star, and
// avoiding a repeat can never be bought at the cost of either.
function comparePriority(a, b) {
  if (a.starDiff !== b.starDiff) return a.starDiff - b.starDiff;
  if (a.posPenalty !== b.posPenalty) return a.posPenalty - b.posPenalty;
  return a.repeat - b.repeat;
}

function swapPlayers(ta, ia, tb, ib) {
  const pa = ta.players[ia];
  const pb = tb.players[ib];

  ta.totalStars += pb.stars - pa.stars;
  ta.posCount[pa.position]--;
  ta.posCount[pb.position]++;
  ta.players[ia] = pb;

  tb.totalStars += pa.stars - pb.stars;
  tb.posCount[pb.position]--;
  tb.posCount[pa.position]++;
  tb.players[ib] = pa;
}

// Hill-climbing polish: only ever keeps a swap that strictly improves
// the score (per comparePriority), so it can never make the
// multi-restart result worse.
function localSearch(teams, prevKey, iterations) {
  let score = scoreTeams(teams, prevKey);

  for (let i = 0; i < iterations && teams.length > 1; i++) {
    const ai = Math.floor(Math.random() * teams.length);
    let bi = Math.floor(Math.random() * teams.length);
    if (bi === ai) bi = (bi + 1) % teams.length;

    const ta = teams[ai], tb = teams[bi];
    if (!ta.players.length || !tb.players.length) continue;

    const ia = Math.floor(Math.random() * ta.players.length);
    const ib = Math.floor(Math.random() * tb.players.length);

    swapPlayers(ta, ia, tb, ib);
    const newScore = scoreTeams(teams, prevKey);

    if (comparePriority(newScore, score) < 0) score = newScore;
    else swapPlayers(ta, ia, tb, ib); // revert, no improvement
  }

  return teams;
}

function runSort() {
  const { playersPerTeam } = S.cfg;
  // Only players marked present for this pelada compete for a spot —
  // filtered here, before construction, so buildCandidate never even
  // sees the absent players (not just "ignores" them afterwards).
  const selectedPlayers = S.players.filter(p => S.selectedPlayerIds.has(p.id));
  // Team count is derived, not configured: however many full teams of
  // playersPerTeam fit, plus one partial team for the remainder — see
  // buildCandidate's capacity logic. Math.max(1, ...) is only a guard for
  // the unreachable selectedPlayers.length===0 case (doSort() already
  // blocks that before runSort() is ever called).
  const numTeams = Math.max(1, Math.ceil(selectedPlayers.length / playersPerTeam));
  const prevTeams = S.result ? S.result.teams : null;
  const prevKey   = prevTeams ? partitionKey(prevTeams) : null;

  const TRIALS = 400;
  let best = null;
  let bestScore = null;

  for (let i = 0; i < TRIALS; i++) {
    const candidate = buildCandidate(selectedPlayers, numTeams, playersPerTeam);
    const score = scoreTeams(candidate.teams, prevKey);

    if (best === null || comparePriority(score, bestScore) < 0) {
      bestScore = score;
      best = candidate;
    } else if (comparePriority(score, bestScore) === 0 && Math.random() < 0.5) {
      best = candidate; // random pick among equally good solutions
    }
  }

  best.teams = localSearch(best.teams, prevKey, 200);

  // Identification only — does not touch best.teams' order, membership,
  // or any of the scoring above. Only the first two teams (by the order
  // the algorithm produced) wear a vest; everyone after is "Nº Fora". Which
  // two colors those are comes from this football's own settings (see
  // Configurações/saveSettings), falling back to Amarelo/Azul.
  const football = S.footballs.find(f => f.id === S.currentFootballId);
  const vc = (football && football.vestColors) || DEFAULT_VEST_COLORS;
  const vestTeams = [
    { name: vc.team1, accent: VEST_COLOR_PALETTE[vc.team1] || VEST_COLOR_PALETTE[DEFAULT_VEST_COLORS.team1], emoji: VEST_COLOR_EMOJI[vc.team1] || '' },
    { name: vc.team2, accent: VEST_COLOR_PALETTE[vc.team2] || VEST_COLOR_PALETTE[DEFAULT_VEST_COLORS.team2], emoji: VEST_COLOR_EMOJI[vc.team2] || '' }
  ];

  const teams = best.teams.map((t, i) => {
    const vest = vestTeams[i];
    const isOut = !vest;
    const outIndex = i - vestTeams.length + 1; // 1, 2, 3, ...
    return {
      label:   `Time ${i + 1}`,
      name:    vest ? vest.name : `${outIndex}º Fora`,
      emoji:   vest ? vest.emoji : '',
      accent:  vest ? vest.accent : OUT_ACCENT,
      isOut,
      players: t.players,
      totalStars: t.totalStars
    };
  });

  return { teams, reserves: best.reserves };
}

// untouched (no football is dropped from S.footballs, no navigation

async function deleteFootballConfirmed() {

// ──────────────────────────────────────────────
//  FINANCEIRO
// ──────────────────────────────────────────────
//
// Same rule as Ranking's presence: the HISTÓRICO is the sole source of
// truth for who participated in a pelada. No parallel participant list —
// financeForRecord() reads the exact same record.teams[*].players +
// record.reserves that Ranking/History already use, so a late-added
// player (already just a regular entry there — see confirmAddLatePlayers,
// untouched) is automatically included with zero special-casing.
// Payment status (`paid`) and the per-pelada price snapshot live on that
// SAME record — never on the global player cadastro (S.players) — so
// "Japa pagou em 27/08 mas deve em 03/09" is naturally two independent
// booleans on two independent records.

function formatBRL(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-R$ ' : 'R$ ') + Math.abs(v).toFixed(2).replace('.', ',');
}

// Single source of calculation for a pelada's numbers — used by the
// dashboard summary, the detail screen and the share text alike, so they
// can never diverge. pricePerPlayer/fieldCost fall back to the football's
// CURRENT Configurações only for records saved before this feature
// existed (record.pricePerPlayer/fieldCost undefined) — that fallback is
// only used for display/calculation here, it is never written back into
// the record (see section 13: no silent overwrite of old data).
function financeForRecord(record, football) {
  const pricePerPlayer = record.pricePerPlayer != null ? record.pricePerPlayer : ((football && football.pricePerPlayer) || 0);
  const fieldCost = record.fieldCost != null ? record.fieldCost : ((football && football.fieldCost) || 0);

  const participants = record.teams.flatMap(t => t.players).concat(record.reserves);
  const paidCount = participants.filter(p => p.paid).length;

  const totalExpected = participants.length * pricePerPlayer;
  const totalReceived = paidCount * pricePerPlayer;
  const totalOpen = totalExpected - totalReceived;
  const balance = totalReceived - fieldCost;

  return { participants, pricePerPlayer, fieldCost, totalExpected, totalReceived, totalOpen, balance, paidCount };
}

const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Which month/year a pelada "belongs to", for filtering/archiving only —
// purely derived from data the record already has, nothing new stored.
// Prefers gameDate (the day the pelada actually happened, "DD/MM/YYYY" —
// see saveResultToHistory) since that's the period it should be filed
// under; falls back to createdAt for any legacy/malformed gameDate.
function recordMonthYear(record) {
  const parts = (record.gameDate || '').split('/');
  if (parts.length === 3) {
    const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
    if (d && m >= 1 && m <= 12 && y) return { year: y, month: m };
  }
  const dt = new Date(record.createdAt);
  return { year: dt.getFullYear(), month: dt.getMonth() + 1 };
}

// All peladas of the current football whose gameDate falls in the given
// year (and, when given, month), most recent first — the SAME S.history
// array Ranking/Histórico already read, just filtered, never copied into
// a parallel list. month === null/undefined means "Todos" — the whole
// year (visão anual).
function financeRecordsForPeriod(year, month) {
  return S.history
    .filter(r => { const my = recordMonthYear(r); return my.year === year && (month == null || my.month === month); })
    .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
}

// Every distinct year/month that has at least one saved pelada, excluding
// the real current month/year (that one stays "active", never archived —
// see openFinance()), sorted most recent first and grouped by year for
// the "Arquivadas" screen.
function getArchivedMonths() {
  const now = new Date();
  const curYear = now.getFullYear(), curMonth = now.getMonth() + 1;
  const seen = new Map();
  S.history.forEach(r => {
    const { year, month } = recordMonthYear(r);
    if (year === curYear && month === curMonth) return;
    seen.set(year + '-' + month, { year, month });
  });
  const months = [...seen.values()].sort((a, b) => b.year - a.year || b.month - a.month);
  const byYear = [];
  months.forEach(m => {
    let group = byYear.find(g => g.year === m.year);
    if (!group) { group = { year: m.year, months: [] }; byYear.push(group); }
    group.months.push(m.month);
  });
  return byYear;
}

// CONTROLE FINANCEIRO panel: sums only the peladas of the currently
// filtered year (and month, when one is picked instead of "Todos") —
// section 1/6, works identically for a single month or a whole year since
// financeRecordsForPeriod already handles month === null as "the year".
// Field cost is summed unconditionally per pelada (it's a real expense
// regardless of who paid); received only counts players actually marked
// paid — never the "previsto" amount.
function computeFinanceOverview(year, month) {
  const football = S.footballs.find(f => f.id === S.currentFootballId);
  let totalReceived = 0, totalFieldCost = 0;
  financeRecordsForPeriod(year, month).forEach(record => {
    const f = financeForRecord(record, football);
    totalReceived += f.totalReceived;
    totalFieldCost += f.fieldCost;
  });
  return { totalReceived, totalFieldCost, balance: totalReceived - totalFieldCost };
}

// Month-by-month rows for the annual ("Todos") view (section 6) — one
// entry per month that actually has a pelada, Jan→Dez, each computed with
// the exact same computeFinanceOverview() the single-month view uses, so
// they can never diverge from each other or from the yearly total.
function financeMonthlyBreakdown(year) {
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    if (financeRecordsForPeriod(year, m).length === 0) continue;
    rows.push({ month: m, overview: computeFinanceOverview(year, m) });
  }
  return rows;
}

// Always opens on the real current month/year (section 2) — the filter
// only changes what's displayed, it is never remembered across opens.

// Reuses the exact same buildShareText/shareText split already used for
// history results — only the text-building differs, the actual
// share-or-copy mechanism (navigator.share with a copy-to-clipboard
// fallback) is 100% shared, not reimplemented. A plain payment checklist
// for the group chat — deliberately omits every money figure (valor por
// jogador, total, recebido, em aberto, campo, saldo), which stay
// Controle Financeiro's internal/administrative numbers, never broadcast
// (section 11: "não compartilhar informações internas desnecessárias").
// financeForRecord() is still called (unchanged) purely to get the
// paid/unpaid participant list — its money fields are just never read here.
function buildFinanceShareText(record, football) {
  const f = financeForRecord(record, football);
  const sorted = [...f.participants].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

  let txt = '*Lista de Pagamento*\n\n';
  txt += `⚽ FUTEBOL — ${record.gameDate}\n\n`;
  txt += 'Jogadores:\n';
  sorted.forEach(p => { txt += `${p.paid ? '✅' : '❌'} ${p.name}\n`; });

  // Snapshotted on the record itself (saveResultToHistory) — never falls
  // back to the football's CURRENT Pix key/recipient name, so changing
  // them later never appears retroactively on an older pelada's share
  // text. Records saved before these fields existed simply have neither,
  // which is indistinguishable from "left blank". Independent of each
  // other: either line can appear alone, both, or neither.
  const pixLines = [];
  if (record.pixKey) pixLines.push(`💠 Pix: ${record.pixKey}`);
  if (record.pixRecipientName) pixLines.push(`👤 Recebedor: ${record.pixRecipientName}`);
  if (pixLines.length) txt += `\n${pixLines.join('\n')}\n`;

  return txt;
}

function shareFinanceRecord(recordId) {

  if (!record) return;
  const football = S.footballs.find(f => f.id === S.currentFootballId);
  const txt = buildFinanceShareText(record, football);
  shareText(txt, `Acerto de Contas — ${record.gameDate}`);
}

// Sums goals/assists/presence across every saved history record (all
// peladas of the current football), grouped by playerId — never by name.
// Late-added players are just regular entries in record.teams[i].players,
// so they're included automatically, no special-casing needed. Presence
// is derived straight from the history — NOT a separate tracked value —
// counting 1 per DISTINCT record a player's id appears in at all (team,
// reserve, or late-added), deduped via a per-record Set so a player can
// never count twice for the same pelada even if present in two places at
// once. Old records missing goals/assists just contribute 0 for those
// (p.goals || 0) but still count fully for presence, since presence only
// depends on the player having been part of the record at all. Uses the
// player's CURRENT cadastro name when they're still registered
// (S.players), falling back to whatever name was snapshotted in the
// first record found for them if they were later removed from cadastro.
function computePlayerStats() {
  const totals = {};
  S.history.forEach(record => {
    const all = record.teams.flatMap(t => t.players).concat(record.reserves);
    const seenInThisRecord = new Set();
    all.forEach(p => {
      if (!totals[p.id]) totals[p.id] = { id: p.id, name: p.name, goals: 0, assists: 0, presence: 0 };
      totals[p.id].goals += p.goals || 0;
      totals[p.id].assists += p.assists || 0;
      if (!seenInThisRecord.has(p.id)) {
        totals[p.id].presence += 1;
        seenInThisRecord.add(p.id);
      }
    });
  });
  S.players.forEach(p => { if (totals[p.id]) totals[p.id].name = p.name; });
  return Object.values(totals);
}

// One of 'goals' | 'assists' | 'presence'. Only players with a positive
// total for THAT category are listed (a player with 0 gols simply isn't
// part of the Gols ranking, even if they show up in Presença) — ties
// broken alphabetically by name, per pt-BR collation.
function computeRanking(category) {
  const field = category === 'assists' || category === 'presence' ? category : 'goals';
  return computePlayerStats()
    .filter(p => p[field] > 0)
    .sort((a, b) => (b[field] - a[field]) || a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
}

function setRankingSort(by) {
  S.rankingSortBy = by;
  S.rankingShareFlash = null; // switching tabs invalidates any "copiado" note from the previous category
  render();
}

// Timer for rankingShareFlash's self-dismiss — module-level so a second
// share while the note is still showing restarts the countdown instead of
// stacking timers.
let rankingShareTimer = null;

function showRankingShareFlash(message) {
  S.rankingShareFlash = message;
  render();
  clearTimeout(rankingShareTimer);
  rankingShareTimer = setTimeout(() => {
    S.rankingShareFlash = null;
    render();
  }, 2500);
}

// Clipboard fallback for shareRanking() — deliberately its own helper
// (not the existing copyText(), used by History/Finance's share buttons)
// because that one confirms via alert(), which this feature must not use.
function copyRankingText(txt) {
  const fallbackCopy = () => {
    const el = document.createElement('textarea');
    el.value = txt; el.style.position = 'fixed'; el.style.opacity = '0';
    document.body.appendChild(el); el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showRankingShareFlash('✓ Ranking copiado');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => showRankingShareFlash('✓ Ranking copiado')).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

// Shares ONLY the category currently on screen — reuses computeRanking()
// (same data, same order, same tie-break) and RANKING_CATEGORIES' own
// unit() for singular/plural, so nothing here recalculates or re-derives
// anything already computed elsewhere. Defaults to whichever tab is
// active (S.rankingSortBy) when called without an explicit category, but
// the rank-share-btn always passes the active one explicitly anyway.
function shareRanking(category) {
  const cat = RANKING_CATEGORIES[category] ? category : S.rankingSortBy;
  const info = RANKING_CATEGORIES[cat];
  const ranking = computeRanking(cat);

  if (ranking.length === 0) {
    showRankingShareFlash(`Nenhum dado de ${info.label.toLowerCase()} para compartilhar ainda.`);
    return;
  }

  let txt = `🏆 Ranking de ${info.label}\n\n`;
  ranking.forEach((p, i) => {
    txt += `${info.icon} ${i + 1}º ${p.name} — ${p[cat]} ${info.unit(p[cat])}\n`;
  });
  txt += '\nTira Time';

  const title = `Ranking de ${info.label} — Tira Time`;
  if (navigator.share) {
    navigator.share({ title, text: txt }).catch(err => {
      if (err && err.name === 'AbortError') return; // user dismissed the native share sheet — not a failure
      copyRankingText(txt);
    });
  } else {
    copyRankingText(txt);
  }
}

// Shared by both a live result and a saved history record — the caller
// decides the data source, this only formats it.
function buildShareText(teams, reserves, gameDate) {
  let txt = '⚽ SORTEIO DE TIMES ⚽\n';
  if (gameDate) txt += `📅 ${gameDate}\n`;
  txt += '\n';

  teams.forEach(t => {
    const header = t.isOut ? `⏳ ${t.name} (aguardando)` : `🎽 Colete ${t.name}`;
    txt += `${header}  (${t.totalStars} ★)\n`;
    orderByPosition(t.players).forEach(p => txt += `  [${p.position}] ${p.name}${p.late ? ' (atrasado)' : ''}\n`);
    txt += '\n';
  });

  if (reserves.length) {
    txt += '🪑 Reservas:\n';
    orderByPosition(reserves).forEach(p => txt += `  [${p.position}] ${p.name}\n`);
  }

  return txt;
}

function shareText(txt, title) {
  if (navigator.share) {
    navigator.share({ title, text: txt }).catch(() => copyText(txt));
  } else {
    copyText(txt);
  }
}

// Idempotent: a second click (or a stray double-tap) while already saved
// is a no-op, so no accidental duplicate history entries.
function saveResultToHistory() {
  if (!S.result || S.savedResultId) return;

  const now = new Date();
  const playerCount = S.result.teams.reduce((sum, t) => sum + t.players.length, 0) + S.result.reserves.length;
  const football = S.footballs.find(f => f.id === S.currentFootballId);

  const record = {
    id: uid(),
    gameDate: now.toLocaleDateString('pt-BR'),
    createdAt: now.toISOString(),
    numTeams: S.result.teams.length,
    playerCount,
    // Snapshotted from the football's CURRENT Configurações at the moment
    // this pelada is saved — never re-read live from settings afterwards,
    // so editing the default later never changes an already-saved pelada
    // (see financeForRecord's fallback for records saved before this
    // field existed at all).
    pricePerPlayer: (football && football.pricePerPlayer) || 0,
    fieldCost: (football && football.fieldCost) || 0,
    pixKey: (football && football.pixKey) || '',
    pixRecipientName: (football && football.pixRecipientName) || '',
    // Deep, fully independent copy — JSON round-trip severs any reference
    // to the live player objects in S.players, so a later cadastro edit
    // (name/stars/position) can never change an already-saved record.
    teams: JSON.parse(JSON.stringify(S.result.teams)),
    reserves: JSON.parse(JSON.stringify(S.result.reserves))
  };

  S.history.push(record);
  persistHistory();
  S.savedResultId = record.id;
  render();
}

// ──────────────────────────────────────────────
//  HISTORY — add late-arriving players to an already-saved record
// ──────────────────────────────────────────────
//
// This never touches S.players, S.selectedPlayerIds or the ORIGINAL
// entries already in record.teams/reserves — it only appends new player
// snapshots (flagged late:true) onto the saved record itself. The live
// S.result / current draw is completely untouched, and no new sort runs.

// Ids of everyone already part of this record (any team or reserves) —
// used both to lock those rows in the picker and, defensively, to make
// sure confirmAddLatePlayers() can never add the same player twice.
function lateUsedIds(record) {
  const usedIds = new Set();
  record.teams.forEach(t => t.players.forEach(p => usedIds.add(p.id)));
  record.reserves.forEach(p => usedIds.add(p.id));
  return usedIds;
}

function openAddLatePlayers(recordId) {
  S.addLateRecordId = recordId;
  S.addLateSelections = new Set();
  render();
  navPush(false); // detalhe do sorteio → Adicionar atrasado (nested)
}

function closeAddLatePlayers() {
  S.addLateRecordId = null;
  S.addLateSelections = new Set();
  render();
  navBack();
}

function toggleLatePlayer(id) {
  if (S.addLateSelections.has(id)) S.addLateSelections.delete(id);
  else S.addLateSelections.add(id);
  render();
}

// Confirms the batch: each checked player is copied (current cadastro
// data, same as saveResultToHistory already does for the original draw)
// straight onto the LAST team of THIS saved record — no sort, no
// redistribution. This never calls buildCandidate/scoreTeams/
// comparePriority/swapPlayers/localSearch and never touches S.result —
// it purely appends to the already-saved record.teams array in place.
// Every player already in the record (any team, any position) stays
// exactly where they are; only the last team's players/totalStars grow.
function confirmAddLatePlayers() {
  const record = S.history.find(r => r.id === S.addLateRecordId);
  if (!record) return;

  const usedIds = lateUsedIds(record);
  const ids = [...S.addLateSelections].filter(id => !usedIds.has(id));
  if (ids.length === 0) { alert('Selecione ao menos um jogador.'); return; }

  const lastTeam = record.teams[record.teams.length - 1];

  ids.forEach(id => {
    const player = S.players.find(p => p.id === id);
    if (!player || !lastTeam) return;

    lastTeam.players.push({ id: player.id, name: player.name, position: player.position, stars: player.stars, late: true });
    lastTeam.totalStars += player.stars;
  });

  record.playerCount = record.teams.reduce((sum, t) => sum + t.players.length, 0) + record.reserves.length;
  persistHistory();
  closeAddLatePlayers();
}

// ──────────────────────────────────────────────
//  HISTORY — match stats (goals/assists) feeding the Ranking
// ──────────────────────────────────────────────
//
// Goals/assists live directly on the SAME player objects already inside
// record.teams[i].players / record.reserves — no parallel structure.
// They're a snapshot of that participation in that pelada, same spirit as
// the id/name/position/stars already stored there; player.stars/position
// and S.players are never touched. Old records simply don't have these
// fields yet — every read below falls back to 0 (p.goals || 0), so
// nothing breaks and nothing is migrated destructively.

// +1/-1 (or any delta) to one stat for one player inside the record
// CURRENTLY being viewed (S.historyViewId) — mutates in memory only;
// persistHistory() is only called from saveHistoryStats() below, so nothing
// is written to Firestore until the user explicitly saves.
function changeStat(playerId, field, delta) {
  const record = S.history.find(r => r.id === S.historyViewId);
  if (!record) return;
  const player = record.teams.flatMap(t => t.players).concat(record.reserves).find(p => p.id === playerId);
  if (!player) return;
  player[field] = Math.max(0, (player[field] || 0) + delta); // never negative
  S.statsSavedFlash = false; // editing again invalidates the previous confirmation
  render();
}

// Persists the CURRENT in-memory state of this record (already carrying
// whatever changeStat() edited) — updates the SAME history record, no new
// record/date/document is ever created.
function saveHistoryStats() {
  if (!S.historyViewId) return;
  persistHistory();
  S.statsSavedFlash = true;
  render();
}

function copyText(txt) {
  navigator.clipboard.writeText(txt)
    .then(() => alert('✅ Copiado para a área de transferência!'))
    .catch(() => {
      // fallback
      const el = document.createElement('textarea');
      el.value = txt; el.style.position = 'fixed'; el.style.opacity = '0';
      document.body.appendChild(el); el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      alert('✅ Copiado!');
    });
}

//  HELPERS
// ──────────────────────────────────────────────

const POS_LABEL = { G: 'Goleiro', D: 'Defesa', M: 'Meio', A: 'Ataque' };
const POS_ORDER = { G: 0, D: 1, M: 2, A: 3 };

const WEEKDAYS = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];

// Display-only helper: returns a NEW array sorted G→D→M→A, stable within
// the same position. Never mutates the array passed in (used only when
// rendering the sort result, not by the sorting algorithm itself).
function orderByPosition(players) {
  return [...players].sort((a, b) => POS_ORDER[a.position] - POS_ORDER[b.position]);
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function stars(n) {
  let out = '';
  for (let i = 1; i <= 3; i++) {
    out += `<span class="star ${i <= n ? 'star-filled' : 'star-empty'}">★</span>`;
  }
  return out;
}

//  RENDER — DASHBOARD
// ──────────────────────────────────────────────

// renderAuthBar() below only ever renders its "signed in" branch (avatar +
// Sair) here — render()'s auth gate means renderDashboard() is never
// reached while S.authUser is null/undefined; the "Entrar com Google"
// branch only ever renders from renderLoginScreen().
// Shown only when a real `beforeinstallprompt` event is currently held in
// S.pwaInstallEvent and the app isn't already installed/running standalone
// — never a fake/simulated install affordance. Stays empty on browsers/
// platforms that never fire the event (e.g. iOS Safari).
function renderInstallCard() {
  if (!S.pwaInstallEvent || S.pwaInstalled || isStandaloneDisplay()) return '';
  return `
    <div class="install-card" onclick="installApp()">
      <div class="install-card-icon">⬇️</div>
      <div class="install-card-text">
        <div class="install-card-title">Instalar Tira Time</div>
        <div class="install-card-sub">Tenha acesso rápido ao Tira Time pela tela inicial.</div>
      </div>
    </div>`;
}

function renderDashboard() {
  const sorted = [...S.footballs].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  return `
  <div class="main" style="padding-bottom:calc(110px + env(safe-area-inset-bottom, 0px))">
    <div class="dash-banner">
      <img src="Images/Logo.png" alt="Tira Time" loading="eager">
    </div>
    ${renderAuthBar()}
    ${renderInstallCard()}
    ${sorted.length === 0 ? `
      <div class="empty">
        <div class="ico">⚽</div>
        <h3>Nenhum futebol cadastrado</h3>
        <p>Toque em "Adicionar pelada" para criar o primeiro</p>

      <div class="dash-card" onclick="openFootball('${f.id}')">
        <div class="dash-card-top">
          <div class="dash-card-icon">⚽</div>
          <div class="dash-card-name">${esc(f.name)}</div>
        </div>
        ${f.dayOfWeek || f.time ? `<div class="dash-card-meta">${f.dayOfWeek ? `<span>📅 ${esc(f.dayOfWeek)}</span>` : ''}${f.time ? `<span>🕐 ${esc(f.time)}</span>` : ''}</div>` : ''}

  <div class="bottom-bar safe-bottom">
    <button class="dash-add-btn" onclick="openAddFootball()">Adicionar pelada</button>

}

const RANKING_CATEGORIES = {
  goals:    { label: 'Gols',          icon: '⚽', unit: (n) => `gol${n !== 1 ? 's' : ''}`,
              empty: 'Registre gols em um sorteio salvo no Histórico para começar.' },
  assists:  { label: 'Assistências',  icon: '👟', unit: (n) => `assistência${n !== 1 ? 's' : ''}`,
              empty: 'Registre assistências em um sorteio salvo no Histórico para começar.' },
  presence: { label: 'Presença',      icon: '👥', unit: (n) => `presença${n !== 1 ? 's' : ''}`,
              empty: 'Salve um sorteio no Histórico para começar a contar presenças.' }
};
const RANK_MEDALS = ['🥇', '🥈', '🥉'];

// Ranking: 3 categories (Gols/Assistências/Presença), each an accumulated
// view over every saved sorteio of the current football, grouped by
// playerId (see computePlayerStats/computeRanking). Same data/order as
// before; only the presentation changed — see the CSS comment above
// ".ranking-modal" for why the category tabs and rows got dedicated
// classes instead of reusing .pos-opt/.player-card.
function renderRankingModal() {
  const cat = RANKING_CATEGORIES[S.rankingSortBy] ? S.rankingSortBy : 'goals';
  const info = RANKING_CATEGORIES[cat];
  const ranking = computeRanking(cat);
  const initial = (name) => esc((name.trim()[0] || '?').toUpperCase());

  // Podium framing only for Gols/Assistências — Presença commonly has
  // several players tied on the same count, and a podium would visually
  // imply a difference the data doesn't have (see item 5, "empates").
  const podiumCount = (cat === 'goals' || cat === 'assists') ? Math.min(3, ranking.length) : 0;
  const podium = ranking.slice(0, podiumCount);
  const rest = ranking.slice(podiumCount);

  return `
  <div class="overlay ranking-modal" onclick="overlayClose(event)">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">
          <span class="confirm-icon accent" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6"/><path d="M9 10 6 3M15 10l3-7M9.5 3h5"/></svg></span>
          <div>
            <div class="rank-title-main">Ranking</div>
            <div class="rank-title-sub">Destaques da pelada</div>
          </div>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="rank-tabs">
        ${Object.keys(RANKING_CATEGORIES).map(key => `
          <div class="rank-tab ${cat === key ? 'active' : ''}" onclick="setRankingSort('${key}')">
            <span class="rank-tab-ico">${RANKING_CATEGORIES[key].icon}</span>${RANKING_CATEGORIES[key].label}
          </div>
        `).join('')}
      </div>

      <div class="rank-share-row">
        <button class="rank-share-btn" onclick="shareRanking('${cat}')" aria-label="Compartilhar ranking de ${info.label}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
          Compartilhar
        </button>
      </div>
      ${S.rankingShareFlash ? `<div class="note note-ok" style="text-align:center;margin:-4px 0 12px">${esc(S.rankingShareFlash)}</div>` : ''}

      ${ranking.length === 0 ? `
        <div class="empty" style="padding:36px 10px">
          <div class="ico">🏅</div>
          <h3>Nenhum dado de ${info.label.toLowerCase()} ainda.</h3>
          <p>${info.empty}</p>
        </div>
      ` : `
        ${podium.length > 0 ? `
          <div class="rank-podium">
            ${podium.map((p, i) => `
              <div class="rank-podium-row rank-podium-${i + 1}">
                <div class="rank-medal">${RANK_MEDALS[i]}</div>
                <div class="rank-avatar">${initial(p.name)}</div>
                <div class="rank-info">
                  <div class="rank-name">${esc(p.name)}</div>
                  <div class="rank-stat">${p[cat]} ${info.unit(p[cat])}</div>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <div class="rank-list">
          ${rest.map((p, i) => `
            <div class="rank-row">
              <div class="rank-num">${podiumCount + i + 1}</div>
              <div class="rank-avatar-sm">${initial(p.name)}</div>
              <div class="rank-name-sm">${esc(p.name)}</div>
              <div class="rank-stat-sm">${p[cat]} ${info.unit(p[cat])}</div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  </div>`;
}

function renderFinanceModal() {
  if (S.financeRecordId) return renderFinanceDetail();
  if (S.financeView === 'archive') return renderFinanceArchive();
  return renderFinanceDashboard();
}

// Dashboard: month/year filter (month includes "Todos" = whole year) +
// two CLEARLY separate sections — CONTROLE FINANCEIRO (money in/out
// summary only, no per-pelada list) and ACERTO DE CONTAS (the peladas of
// the period, each a doorway into payment tracking). Reuses .team-card
// for every card, .sec-title for both section headers — no new component.
function renderFinanceDashboard() {
  const year = S.financeFilterYear, month = S.financeFilterMonth;
  const isYearView = month == null;
  const overview = computeFinanceOverview(year, month);
  const records = financeRecordsForPeriod(year, month);
  const periodLabel = isYearView ? `${year}` : `${MONTH_NAMES_PT[month - 1]}/${year}`;

  const yearOptions = [...new Set(S.history.map(r => recordMonthYear(r).year).concat([year]))].sort((a, b) => b - a);

  return `
  <div class="overlay finance-modal" onclick="overlayClose(event)">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">
          <span class="confirm-icon accent" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v10M15 9.5c0-1.1-1.3-2-3-2s-3 .9-3 2 1.3 1.5 3 1.5 3 .5 3 1.5-1.3 2-3 2-3-.9-3-2"/></svg></span>
          <div>
            <div class="finance-title-main">Financeiro</div>
            <div class="finance-title-sub">Controle e acerto das peladas</div>
          </div>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="finance-filters">
        <select class="finput" onchange="setFinanceFilter(this.value, ${isYearView ? "'all'" : month})">
          ${yearOptions.map(y => `<option value="${y}" ${year === y ? 'selected' : ''}>${y}</option>`).join('')}
        </select>
        <select class="finput" onchange="setFinanceFilter(${year}, this.value)">
          <option value="all" ${isYearView ? 'selected' : ''}>Todos os meses</option>
          ${MONTH_NAMES_PT.map((name, i) => `<option value="${i + 1}" ${month === i + 1 ? 'selected' : ''}>${name}</option>`).join('')}
        </select>
      </div>

      <div class="sec-title">Controle Financeiro</div>
      <div class="finance-summary-card">
        <div class="finance-summary-period">${esc(periodLabel)}</div>
        <div class="finance-summary-label">Saldo disponível</div>
        <div class="finance-summary-balance" style="color:${overview.balance < 0 ? 'var(--danger)' : 'var(--green-d)'}">${formatBRL(overview.balance)}</div>
        <div class="finance-summary-rows">
          <div class="finance-summary-row">
            <span>Recebido</span>
            <strong style="color:var(--green-d)">${formatBRL(overview.totalReceived)}</strong>
          </div>
          <div class="finance-summary-row">
            <span>Campos</span>
            <strong>${formatBRL(overview.totalFieldCost)}</strong>
          </div>
        </div>
        ${isYearView ? (() => {
          const breakdown = financeMonthlyBreakdown(year);
          return `
          <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
            <div style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px">Por mês</div>
            ${breakdown.length === 0 ? `<div style="font-size:.82rem;color:var(--muted)">Nenhuma pelada em ${year}.</div>` : breakdown.map(row => `
              <div style="display:flex;justify-content:space-between;gap:6px;font-size:.8rem;padding:4px 0">
                <span style="color:var(--muted);flex:1">${MONTH_NAMES_PT[row.month - 1]}</span>
                <span style="color:var(--muted)">${formatBRL(row.overview.totalReceived)} · ${formatBRL(row.overview.totalFieldCost)}</span>
                <span style="font-weight:700;color:${row.overview.balance < 0 ? 'var(--danger)' : 'var(--green-d)'}">${formatBRL(row.overview.balance)}</span>
              </div>
            `).join('')}
          </div>`;
        })() : ''}
      </div>

      <div class="sec-title" style="margin-top:22px">Acerto de Contas</div>
      ${records.length === 0 ? `
        <div class="empty" style="padding:36px 10px">
          <div class="ico">🧾</div>
          <h3>Nenhuma pelada neste período.</h3>
          <p>Peladas de ${esc(periodLabel)} vão aparecer aqui para controle de pagamentos.</p>
        </div>
      ` : records.map(r => {
        const f = financeForRecord(r, S.footballs.find(fb => fb.id === S.currentFootballId));
        return `
        <div class="finance-card">
          <div class="finance-card-title">⚽ Futebol — ${esc(r.gameDate)}</div>
          <div class="finance-card-meta">${f.participants.length} jogador${f.participants.length !== 1 ? 'es' : ''}</div>
          <div class="finance-card-values">
            <div class="finance-card-value-row">
              <span>Recebido</span>
              <strong style="color:var(--green-d)">${formatBRL(f.totalReceived)}</strong>
            </div>
            <div class="finance-card-value-row">
              <span>Em aberto</span>
              <strong style="color:${f.totalOpen > 0 ? 'var(--warn)' : 'var(--muted)'}">${formatBRL(f.totalOpen)}</strong>
            </div>
          </div>
          <div class="finance-card-actions">
            <button class="finance-action-btn finance-action-btn-primary" onclick="openFinanceDetail('${r.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              Ver acerto
            </button>
            <button class="finance-action-btn finance-action-btn-secondary" onclick="shareFinanceRecord('${r.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
              Compartilhar
            </button>
          </div>
        </div>`;
      }).join('')}

      <button class="btn-secondary" style="margin-top:20px" onclick="openFinanceArchive()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
        Ver arquivadas
      </button>
    </div>
  </div>`;
}

// Archive: every month that isn't the real current one, grouped by year
// descending, most recent month first within each year. Selecting a month
// just re-points the same filter the dashboard reads (section 5 —
// arquivado ≠ inacessível: it's the identical query/screen, only the
// entry point differs).
function renderFinanceArchive() {
  const groups = getArchivedMonths();

  return `
  <div class="overlay" onclick="overlayClose(event)">
    <div class="modal">
      <div class="modal-head">
        <div style="display:flex;align-items:center;gap:8px">
          <button class="close-btn" onclick="backToFinanceDashboard()" title="Voltar ao Financeiro">←</button>
          <div class="modal-title">📂 Arquivadas</div>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      ${groups.length === 0 ? `
        <div class="empty" style="padding:36px 10px">
          <div class="ico">📂</div>
          <h3>Nenhum mês arquivado ainda.</h3>
          <p>Peladas de meses anteriores ao atual vão aparecer aqui.</p>
        </div>
      ` : groups.map(g => `
        <div class="sec-title">${g.year}</div>
        ${g.months.map(m => {
          const ov = computeFinanceOverview(g.year, m);
          const count = financeRecordsForPeriod(g.year, m).length;
          return `
          <div class="team-card" style="border-left-color:var(--green);cursor:pointer;margin-bottom:10px" onclick="selectArchivedMonth(${g.year}, ${m})">
            <div class="team-name">${MONTH_NAMES_PT[m - 1]}</div>
            <div style="font-size:.85rem;color:var(--muted);margin:4px 0 8px">${count} pelada${count !== 1 ? 's' : ''}</div>
            <div style="display:flex;justify-content:space-between;font-size:.85rem">
              <span>Recebido: <strong style="color:var(--green-d)">${formatBRL(ov.totalReceived)}</strong></span>
              <span>Saldo: <strong style="color:${ov.balance < 0 ? 'var(--danger)' : 'var(--green-d)'}">${formatBRL(ov.balance)}</strong></span>
            </div>
          </div>`;
        }).join('')}
      `).join('')}
    </div>
  </div>`;
}

// Detail: full breakdown for one pelada + the complete list of Histórico
// participants (teams + reserves, including late-added ones) with a
// payment checkbox each. Reuses .note for the summary block and
// .player-card/.p-check/.p-checkbox/.late-tag exactly as the rest of the
// app already does — no new list-item styling.
function renderFinanceDetail() {
  const record = S.history.find(r => r.id === S.financeRecordId);
  if (!record) { S.financeRecordId = null; return renderFinanceModal(); }
  const football = S.footballs.find(f => f.id === S.currentFootballId);
  const f = financeForRecord(record, football);
  const sorted = [...f.participants].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

  return `
  <div class="overlay" onclick="overlayClose(event)">
    <div class="modal">
      <div class="modal-head">
        <div style="display:flex;align-items:center;gap:8px">
          <button class="close-btn" onclick="backToFinanceDashboard()" title="Voltar ao Financeiro">←</button>
          <div class="modal-title">⚽ Futebol — ${esc(record.gameDate)}</div>
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="note note-info">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Valor por jogador</span><strong>${formatBRL(f.pricePerPlayer)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Jogadores</span><strong>${f.participants.length}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Total previsto</span><strong>${formatBRL(f.totalExpected)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Total recebido</span><strong style="color:var(--green-d)">${formatBRL(f.totalReceived)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Total em aberto</span><strong style="color:${f.totalOpen > 0 ? '#92400e' : 'inherit'}">${formatBRL(f.totalOpen)}</strong></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Valor pago pelo campo</span><strong>${formatBRL(f.fieldCost)}</strong></div>
        <div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid rgba(0,0,0,.1)">
          <span style="font-weight:800">Saldo da pelada</span>
          <strong style="color:${f.balance < 0 ? 'var(--danger)' : 'var(--green-d)'}">${formatBRL(f.balance)}</strong>
        </div>
      </div>

      <div class="fgroup">
        <label class="flabel">Editar valor do campo desta pelada</label>
        <input class="finput" type="number" min="0" step="0.01" inputmode="decimal"
          value="${f.fieldCost}" onchange="setRecordFieldCost(this.value)">
      </div>

      <div class="sec-title">Pagamentos — ${f.paidCount}/${f.participants.length} pagos</div>
      ${sorted.map(p => `
        <div class="player-card" style="margin-bottom:9px">
          <label class="p-check" title="${p.paid ? 'Pago' : 'Pendente'}">
            <input type="checkbox" class="p-checkbox" ${p.paid ? 'checked' : ''} onchange="togglePayment('${p.id}')">
          </label>
          <div class="p-info">
            <div class="p-name">${esc(p.name)}${p.late ? '<span class="late-tag">🕐 Atrasado</span>' : ''}</div>
          </div>
          <div style="font-weight:700;white-space:nowrap">${formatBRL(f.pricePerPlayer)}</div>
        </div>
      `).join('')}

      <button class="icon-btn" style="color:#0ea5e9" onclick="shareFinanceRecord('${record.id}')">📤 Compartilhar</button>
    </div>
  </div>`;
}

// Shared by the live result screen and the history "Ver" detail — same
// team-card markup either way, just fed live teams or a saved snapshot.
// playerRow lets a caller swap in a different per-player row renderer
// (e.g. the history detail's editable goals/assists row below) while
// keeping the card header/wrapper identical everywhere.
function renderTeamCard(t, playerRow) {
  const row = playerRow || defaultPlayerRow;
  return `
      <div class="team-card roster-team-card ${t.isOut ? 'team-out' : ''}" style="border-left-color:${t.accent}">
        <div class="team-head">
          <div class="team-name">
            <span class="team-dot" style="background:${t.accent}"></span>
            ${esc(t.name)}
            ${t.isOut ? '<span class="team-out-tag">aguardando</span>' : ''}
          </div>
          <div class="team-pts">${t.totalStars} ★</div>
        </div>
        ${orderByPosition(t.players).map(row).join('')}
      </div>`;
}

function defaultPlayerRow(p) {
  return `
          <div class="tplayer">
            <div class="sm-badge pos-${p.position}">${p.position}</div>
            <div class="pname">${esc(p.name)}${p.late ? '<span class="late-tag">🕐 Atrasado</span>' : ''}</div>
            <div class="pstars">${stars(p.stars)}</div>
          </div>`;
}

// Same idea as defaultPlayerRow, but with compact +/- goals/assists
// controls — used only in the history detail view (see renderHistoryDetail),
// never on the live (not-yet-saved) result screen.
function statsPlayerRow(p) {
  const goals = p.goals || 0;
  const assists = p.assists || 0;
  return `
          <div class="tplayer stat-row">
            <div class="sm-badge pos-${p.position}">${p.position}</div>
            <div class="pname">${esc(p.name)}${p.late ? '<span class="late-tag">🕐 Atrasado</span>' : ''}</div>
            <div class="pstars">${stars(p.stars)}</div>
            <div class="stat-stepper">
              <button class="stat-btn" onclick="changeStat('${p.id}','goals',-1)" title="Diminuir gols">−</button>
              <span class="stat-val">⚽ ${goals}</span>
              <button class="stat-btn" onclick="changeStat('${p.id}','goals',1)" title="Aumentar gols">+</button>
            </div>
            <div class="stat-stepper">
              <button class="stat-btn" onclick="changeStat('${p.id}','assists',-1)" title="Diminuir assistências">−</button>
              <span class="stat-val">👟 ${assists}</span>
              <button class="stat-btn" onclick="changeStat('${p.id}','assists',1)" title="Aumentar assistências">+</button>
            </div>
          </div>`;
}

function renderReserveBlock(reserves, playerRow) {
  if (!reserves.length) return '';
  const row = playerRow || defaultPlayerRow;
  return `
    <div class="sec-title">🪑 Reservas — ${reserves.length} jogador${reserves.length !== 1 ? 'es' : ''}</div>
    <div class="reserve-card">
      ${orderByPosition(reserves).map(row).join('')}
    </div>`;
}

function renderResult() {
  const { teams, reserves } = S.result;
  const drawnCount = teams.reduce((sum, t) => sum + t.players.length, 0) + reserves.length;
  const saved = !!S.savedResultId;

  return `
  <div class="header header-result">
    <div class="header-row">
      <div class="header-id">
        <button class="back-btn" onclick="goBack()" title="Voltar" aria-label="Voltar">←</button>
        <div class="club-chip" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"/><path d="M8 5H5a2 2 0 0 0 0 4h.5M16 5h3a2 2 0 0 1 0 4h-.5"/><path d="M12 12v3M9 19h6M10 15.5h4v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-2Z"/></svg></div>
        <div class="header-id-text">
          <h1 class="header-title">Times Sorteados</h1>
          <div class="header-sub">${teams.length} times · ${teams[0]?.players.length ?? 0} jogadores cada</div>
        </div>
      </div>
      <span class="badge">${drawnCount} jogadores</span>
    </div>
    <div class="header-actions" style="justify-content:flex-end">
      <button class="btn-reset" onclick="saveResultToHistory()" ${saved ? 'disabled' : ''}>
        ${saved
          ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg> Salvo`
          : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3M8 21v-6h8v6"/></svg> Salvar`}
      </button>
    </div>
  </div>

  <div class="main">
    ${teams.map(t => renderTeamCard(t)).join('')}
    ${renderReserveBlock(reserves)}
  </div>

  <div class="bottom-bar result-bar">
    <button class="btn-sort" style="flex:1" onclick="openSort()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      Ressortear
    </button>
  </div>`;
}

//
// Reuses the exact same confirm-modal system as renderConfirmDelete()/
// renderHistoryDeleteConfirm(): `.confirm-modal`/`.confirm-icon.danger`/

// icon. The only additions are the inline error message (S.deleteFootballError)
// and the disabled/"Excluindo…" state (S.deletingFootball) while the
// Firestore delete is in flight — see deleteFootballConfirmed().
function renderDeleteFootballConfirm() {
  const football = S.footballs.find(f => f.id === S.currentFootballId);
  const name = football ? esc(football.name) : 'este futebol';
  const busy = S.deletingFootball;

  return `
  <div class="overlay confirm-modal" onclick="overlayClose(event)">

      ${S.deleteFootballError ? `<p class="confirm-text confirm-text-error">${esc(S.deleteFootballError)}</p>` : ''}

      <div class="confirm-actions">
        <button class="confirm-btn confirm-btn-cancel" onclick="closeModal()" ${busy ? 'disabled' : ''}>Cancelar</button>
        <button class="confirm-btn confirm-btn-danger" onclick="deleteFootballConfirmed()" ${busy ? 'disabled' : ''}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg>
          ${busy ? 'Excluindo…' : 'Excluir grupo'}

  </div>`;
}

function renderSortModal() {
  const { cfg, players, selectedPlayerIds } = S;
  const football = S.footballs.find(f => f.id === S.currentFootballId);
  const vc = (football && football.vestColors) || DEFAULT_VEST_COLORS;
  const selectedCount = players.filter(p => selectedPlayerIds.has(p.id)).length;
  // Team count is derived, not configured — same formula runSort() uses.
  // Capacity (teamCount*playersPerTeam) is always >= selectedCount by
  // construction, so there's no more "not enough slots" error state; the
  // only thing left to guard against is zero players selected.
  const teamCount = selectedCount > 0 ? Math.ceil(selectedCount / cfg.playersPerTeam) : 0;

  let noteHtml = '';
  if (selectedCount === 0) {
    noteHtml = `<div class="sort-note sort-note-err">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      <div class="sort-note-main">Nenhum jogador selecionado. Marque na lista quem está presente antes de sortear.</div>
    </div>`;
  } else {
    noteHtml = `<div class="sort-note sort-note-ok">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <div>
        <div class="sort-note-main">${selectedCount} jogadores → ${teamCount} time${teamCount !== 1 ? 's' : ''} de até ${cfg.playersPerTeam}</div>
        <div class="sort-note-sub">O último time pode ficar com menos</div>
      </div>
    </div>`;
  }

  return `
  <div class="overlay sort-modal" onclick="overlayClose(event)">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">
          <span class="confirm-icon accent" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></span>
          Configurar Sorteio
        </div>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="fgroup">
        <label class="flabel">Jogadores por Time</label>
        <div class="stepper">
          <button class="step-btn" onclick="changePPT(-1)">−</button>
          <div class="step-val">${cfg.playersPerTeam}</div>
          <button class="step-btn" onclick="changePPT(1)">+</button>
        </div>
      </div>

      ${noteHtml}

      <div class="fgroup">
        <label class="flabel">Coletes</label>
        <div class="vest-row">
          <span class="vest-dot" style="background:${VEST_COLOR_PALETTE[vc.team1] || OUT_ACCENT}"></span>
          <span class="vest-team">Time 1</span>
          <span class="vest-color">${esc(vc.team1)}</span>
        </div>
        <div class="vest-row">
          <span class="vest-dot" style="background:${VEST_COLOR_PALETTE[vc.team2] || OUT_ACCENT}"></span>
          <span class="vest-team">Time 2</span>
          <span class="vest-color">${esc(vc.team2)}</span>
        </div>
        ${teamCount > 2
          ? `<div class="vest-row">
               <span class="vest-dot" style="background:${OUT_ACCENT}"></span>
               <span class="vest-team">Demais</span>
               <span class="vest-color out">Fora (sem colete)</span>
             </div>`
          : ''}
        <div class="vest-hint">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
          Cores dos coletes podem ser alteradas em Configurações
        </div>
      </div>

      <button class="btn-primary" onclick="doSort()" ${selectedCount === 0 ? 'disabled' : ''}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        Sortear Agora!
      </button>
    </div>
  </div>`;
}

  if (S.historyDeleteId) return renderHistoryDeleteConfirm();
  if (S.addLateRecordId) return renderAddLateModal();
  if (S.historyViewId) return renderHistoryDetail();

// "Adicionar jogadores atrasados" — sub-screen of the history modal (same
// nesting pattern as renderHistoryDetail/historyViewId) for adding late
// arrivals to one already-saved record. Shows the FULL roster (S.players)
// every time — players already part of this record are shown too, but
// locked ("Já está no sorteio"), so the list never collapses down to an
// empty "nothing available" state just because everyone already drew in.
// Destination team is decided automatically on confirm (see
// confirmAddLatePlayers) — no manual color/team picker here.
function renderAddLateModal() {
  const record = S.history.find(r => r.id === S.addLateRecordId);
  if (!record) { S.addLateRecordId = null; return renderHistoryModal(); }

  const usedIds = lateUsedIds(record);
  const allPlayers = [...S.players].sort((a, b) =>
    a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
  const selectedCount = S.addLateSelections.size;

  return `
  <div class="overlay" onclick="overlayClose(event)">

        const inRecord = usedIds.has(p.id);
        const checked = S.addLateSelections.has(p.id);
        return `
        <div class="player-card ${inRecord ? 'is-absent' : ''}" style="margin-bottom:9px">
          <label class="p-check" title="${inRecord ? 'Já está no sorteio' : 'Selecionar'}">

            <div class="p-stars">${stars(p.stars)}</div>
